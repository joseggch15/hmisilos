<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="hmiSilos: inventario de silos de resina por balance de masa.">
<title>hmiSilos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Crect%20width%3D%2234%22%20height%3D%2234%22%20rx%3D%227%22%20fill%3D%22%23003e7f%22%2F%3E%3Cpath%20d%3D%22M10%205h14v15l-4%206h-6l-4-6z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.2%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M11.2%2014h11.6v5.6l-3.6%205.4h-4.4l-3.6-5.4z%22%20fill%3D%22%23b2dcff%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Sala de control: cabecera clara con la marca y navegación en navy (como ti-films.com), franja navy
   con los indicadores de planta y lienzo gris HMI (ISA-101) con una tarjeta por silo. El color se
   reserva para estados anormales; el semáforo usa forma + color. */
:root {
  --bg: #e6eaf0;
  --surface: #ffffff;
  --surface-2: #f2f4f8;
  --ink: #142133;
  --muted: #586678;
  --line: #c9d1dc;
  --line-soft: #dee3ea;
  --nav-ink: #003e7f;
  --accent: #1d4f91;
  --accent-ink: #ffffff;
  --focus: #048aff;
  --band-bg: #003e7f;
  --band-ink: #ffffff;
  --band-muted: #b2dcff;
  --tank-bg: #f6f8fb;
  --tank-stroke: #4a5869;
  --ok: #2e8b57;
  --warn: #c98f00;
  --crit: #d0021b;
  --info: #048aff;
  --idle: #8a94a3;
  --warn-tint: #fff4d6;
  --crit-tint: #fde4e6;
  --info-tint: #e3f1ff;
  --demo-bg: #fff4d6;
  --demo-ink: #6b4d00;
  --shadow: 0 1px 2px rgba(20, 33, 51, 0.08), 0 4px 14px rgba(20, 33, 51, 0.06);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --radius: 6px;
  --gutter: clamp(16px, 2.5vw, 28px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141c; --surface: #161f2b; --surface-2: #1c2734; --ink: #e3e9f1; --muted: #93a1b4; --line: #2c3a4c; --line-soft: #233143;
    --nav-ink: #cfe0f7; --accent: #5b93e0; --accent-ink: #08121f; --focus: #4aa8ff; --band-bg: #0a2a52; --band-ink: #eaf2fc; --band-muted: #8fbde9;
    --tank-bg: #111a25; --tank-stroke: #8d9bad; --ok: #4cc38a; --warn: #f2c230; --crit: #ff5a67; --info: #4aa8ff; --idle: #6f7d90;
    --warn-tint: #3a2f0c; --crit-tint: #3d1419; --info-tint: #0f2a45; --demo-bg: #3a2f0c; --demo-ink: #f6dc8a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141c; --surface: #161f2b; --surface-2: #1c2734; --ink: #e3e9f1; --muted: #93a1b4; --line: #2c3a4c; --line-soft: #233143;
  --nav-ink: #cfe0f7; --accent: #5b93e0; --accent-ink: #08121f; --focus: #4aa8ff; --band-bg: #0a2a52; --band-ink: #eaf2fc; --band-muted: #8fbde9;
  --tank-bg: #111a25; --tank-stroke: #8d9bad; --ok: #4cc38a; --warn: #f2c230; --crit: #ff5a67; --info: #4aa8ff; --idle: #6f7d90;
  --warn-tint: #3a2f0c; --crit-tint: #3d1419; --info-tint: #0f2a45; --demo-bg: #3a2f0c; --demo-ink: #f6dc8a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); color-scheme: dark;
}

/* Asistente: botón en la cabecera y panel lateral con los mismos tokens, tipografías y botones de la HMI.
   Vive fuera de #main, así sobrevive al refresco periódico del panel de planta. */
.assistant-btn { color: var(--nav-ink); }
.assistant-btn[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.assistant-floating { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; box-shadow: var(--shadow); }
.assistant-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(440px, 100vw);
  display: flex; flex-direction: column; background: var(--surface); color: var(--ink);
  border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(10, 20, 35, 0.18);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.assistant-head { background: var(--band-bg); color: var(--band-ink); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; }
.assistant-head .eyebrow { color: var(--band-muted); }
.assistant-head h3 { font-size: 19px; }
.assistant-head .icon-btn { background: transparent; color: var(--band-ink); border-color: var(--band-muted); }
.assistant-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px 0; }
.assistant-meta .spacer { flex: 1; }
.assistant-hint { margin: 6px 16px 0; font-size: 12px; color: var(--muted); }
.assistant-quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
.assistant-quick button { border: 1px solid var(--line); background: var(--surface-2); color: var(--nav-ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
.assistant-quick button:hover { border-color: var(--accent); }
.assistant-quick button:disabled { opacity: 0.5; cursor: not-allowed; }
.assistant-messages { flex: 1; min-height: 120px; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; }
.assistant-message { border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 9px 12px; font-size: 13px; background: var(--surface); overflow-wrap: anywhere; }
.assistant-message > strong { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.assistant-message p { margin: 4px 0 0; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
.assistant-user { align-self: flex-end; max-width: 85%; background: var(--info-tint); border-color: transparent; }
.assistant-message details { margin-top: 6px; font-size: 12px; color: var(--muted); }
.assistant-message summary { cursor: pointer; color: var(--nav-ink); }
.assistant-status { min-height: 18px; margin: 0 16px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.assistant-panel form { padding: 8px 16px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 6px; }
.assistant-panel textarea { width: 100%; min-height: 56px; max-height: 140px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); font: inherit; }
.assistant-send { display: flex; justify-content: space-between; gap: 8px; }
.assistant-audio { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 16px 6px; font-size: 12px; }
.assistant-audio label { display: inline-flex; align-items: center; gap: 5px; }
.assistant-panel audio { width: calc(100% - 32px); height: 32px; margin: 0 16px 6px; }
.assistant-credits { margin: 0 16px 10px; font-size: 11px; color: var(--muted); }
.assistant-credits summary { cursor: pointer; }
.assistant-credits p { margin: 4px 0; }
@media (max-width: 760px) { .assistant-btn .assistant-label { display: none; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.unit { color: var(--muted); font-size: 0.85em; margin-left: 0.15em; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; font-weight: 600; color: var(--muted); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }

/* ── Cabecera ─────────────────────────────────────────────────────────────── */
.app-header { background: var(--surface); border-bottom: 1px solid var(--line-soft); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.header-row { display: flex; align-items: center; gap: 16px; padding-inline: var(--gutter); padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--nav-ink); text-decoration: none; }
.brand-logo { height: 34px; display: flex; align-items: center; background: #ffffff; border-radius: var(--radius); padding: 2px 6px; }
.brand-logo svg { height: 30px; width: auto; display: block; }
.brand-mark { width: 34px; height: 34px; color: var(--nav-ink); flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.02em; }
.brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.clock { font-family: var(--font-display); font-size: 15px; color: var(--nav-ink); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; background: var(--surface-2); }
.chip-demo { background: var(--demo-bg); color: var(--demo-ink); border-color: transparent; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 9px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); width: 32px; height: 30px; display: inline-grid; place-items: center; cursor: pointer; color: var(--nav-ink); }
.op-select { max-width: 190px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 4px 6px; font-size: 13px; }

.nav { display: flex; gap: 4px; padding-inline: var(--gutter); overflow-x: auto; scrollbar-width: thin; }
.nav a {
  font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--nav-ink); text-decoration: none;
  padding: 8px 12px 9px; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.nav a:hover { border-bottom-color: var(--line); }
.nav a[aria-current="page"] { border-bottom-color: var(--focus); }
.badge { min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; font-size: 11px; font-family: var(--font-body); font-weight: 700; display: inline-grid; place-items: center; background: var(--crit); color: #ffffff; }
.badge.warn { background: var(--warn); color: #1d1600; }

/* ── Franja de indicadores ─────────────────────────────────────────────────── */
.band { background: var(--band-bg); color: var(--band-ink); }
.band-inner { display: flex; gap: 10px 28px; flex-wrap: wrap; align-items: stretch; padding-inline: var(--gutter); padding-block: 10px; }
.kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .label { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.07em; font-size: 11px; color: var(--band-muted); }
.kpi .value { font-size: 20px; font-weight: 600; white-space: nowrap; }
.kpi .value .unit { color: var(--band-muted); }
.kpi-materials { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; font-size: 14px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; border: 1px solid rgba(0, 0, 0, 0.15); }
.demo-banner { background: var(--demo-bg); color: var(--demo-ink); padding-inline: var(--gutter); padding-block: 6px; font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.demo-banner button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: var(--radius); padding: 2px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }

/* ── Contenido ─────────────────────────────────────────────────────────────── */
main { padding-inline: var(--gutter); padding-block: 18px 40px; max-width: 1600px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius);
  padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.run { color: var(--ok); }
.btn.stop { color: var(--crit); }
.btn.danger { color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; }
.btn.ghost:hover { color: var(--crit); border-color: var(--crit); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel > h3 { margin-bottom: 10px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }

/* Tarjetas de silo */
.silo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.silo-card {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); box-shadow: var(--shadow);
  display: grid; grid-template-columns: 96px 1fr; grid-template-rows: auto 1fr auto; gap: 4px 12px; padding: 12px 12px 10px;
  border-left: 5px solid transparent; min-width: 0;
}
.silo-card.state-RED { border-left-color: var(--crit); }
.silo-card.state-YELLOW { border-left-color: var(--warn); }
.silo-card.state-GREY { background: var(--surface-2); box-shadow: none; }
.silo-card header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.silo-card header h3 a { color: inherit; text-decoration: none; }
.silo-card header h3 a:hover { text-decoration: underline; }
.silo-figure { grid-row: 2; display: flex; align-items: flex-start; justify-content: center; }
.silo-figure svg { width: 96px; height: auto; display: block; }
.silo-data { grid-row: 2; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.big { font-size: 26px; font-weight: 600; line-height: 1.1; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; }
.material { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; flex-wrap: wrap; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; padding: 0 4px; }
.tag.warn { border-color: var(--warn); color: var(--ink); background: var(--warn-tint); }
.valve-line { font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.valve-line.running { color: var(--ink); }
.valve-line .state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); display: inline-block; }
.valve-line.running .state-dot { background: var(--ok); }
.valve-line.empty-running .state-dot { background: var(--crit); }
.silo-card footer { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line-soft); padding-top: 8px; margin-top: 4px; }
.pending { font-size: 13px; color: var(--muted); }

/* Semáforo: forma + color */
.light { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; border-radius: 999px; padding: 1px 9px 1px 7px; border: 1px solid var(--line); background: var(--surface); }
.light .glyph { font-size: 12px; line-height: 1; }
.light-GREEN .glyph { color: var(--ok); }
.light-YELLOW { border-color: var(--warn); background: var(--warn-tint); }
.light-YELLOW .glyph { color: var(--warn); }
.light-RED { border-color: var(--crit); background: var(--crit-tint); }
.light-RED .glyph { color: var(--crit); }
.light-GREY .glyph { color: var(--idle); }
.sev { display: inline-flex; gap: 5px; align-items: center; font-weight: 600; white-space: nowrap; }
.sev-CRITICAL { color: var(--crit); }
.sev-WARNING { color: var(--warn); }
.sev-INFO { color: var(--info); }

/* Tablas */
.table-wrap { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11.5px; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
td.r, th.r { text-align: right; }
tr.voided td { color: var(--muted); text-decoration: line-through; }
tr.voided td.keep { text-decoration: none; }
tr:last-child td { border-bottom: 0; }
.empty-state { padding: 28px; text-align: center; color: var(--muted); }

.subtabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.subtabs button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.subtabs button[aria-selected="true"] { color: var(--nav-ink); border-bottom-color: var(--focus); }

/* Detalle */
.detail { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.detail-figure svg { width: 100%; max-width: 220px; height: auto; display: block; margin-inline: auto; }
.chart { width: 100%; height: 320px; }
.chart.short { height: 260px; }
.chart-fallback { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: var(--radius); }

/* Diálogos */
dialog { border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3); }
dialog::backdrop { background: rgba(10, 20, 35, 0.45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.dlg header { padding: 14px 18px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dlg .body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.dlg footer { padding: 12px 18px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 7px 9px; width: 100%; min-width: 0; }
.field input[aria-invalid="true"], .field select[aria-invalid="true"] { border-color: var(--crit); }
.field .err { color: var(--crit); font-size: 12px; }
.field .hint { color: var(--muted); font-size: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.radio-row { display: flex; gap: 6px; flex-wrap: wrap; }
.radio-row label { border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.radio-row input:checked + span { font-weight: 700; color: var(--nav-ink); }
.preview { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; }
.preview dt { color: var(--muted); }
.preview dd { margin: 0; text-align: right; font-weight: 600; }
.notice { border-radius: var(--radius); padding: 9px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.notice.warn { background: var(--warn-tint); }
.notice.crit { background: var(--crit-tint); }
.notice.info { background: var(--info-tint); }
.palette { display: flex; gap: 6px; flex-wrap: wrap; }
.palette label { cursor: pointer; }
.palette input { position: absolute; opacity: 0; pointer-events: none; }
.palette span { width: 26px; height: 26px; border-radius: 5px; display: block; border: 2px solid transparent; }
.palette input:checked + span { border-color: var(--ink); }
.palette input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Avisos emergentes */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--ok); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); padding: 10px 12px; font-size: 13px; }
.toast.warn { border-left-color: var(--warn); }
.toast.crit { border-left-color: var(--crit); }

.selftest td.pass { color: var(--ok); font-weight: 700; }
.selftest td.fail { color: var(--crit); font-weight: 700; }
.about { font-size: 13px; color: var(--muted); }
.cards-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.cards-3 .panel { display: flex; flex-direction: column; gap: 8px; }
.cards-3 .panel p { margin: 0; font-size: 13px; color: var(--muted); }
.cards-3 .panel .btn { align-self: flex-start; margin-top: auto; }

@media (max-width: 760px) {
  .detail { grid-template-columns: 1fr; }
  .brand-sub { display: none; }
  .clock { display: none; }
  .kpi .value { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Plant operations use the same HMI colors and keep tables scrollable on small screens. */
.op-cutoff { margin: 0; font-size: 12px; }
.op-period { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.op-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.op-metric { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.op-metric > strong { font: 600 28px var(--font-display); color: var(--nav-ink); }
.op-metric > p { color: var(--muted); font-size: 12px; margin: 0; }
.op-search { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.op-search input { min-width: min(100%, 260px); flex: 1; max-width: 480px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; }
.op-table { margin-top: 10px; max-width: 100%; }
.op-table table { font-size: 13px; }
.op-table td { vertical-align: top; }
.op-table td small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.op-table td .btn { margin-bottom: 4px; }
.op-table .op-description { min-width: 220px; max-width: 440px; overflow-wrap: anywhere; white-space: normal; }
.op-description p { margin: 4px 0; }
.op-description details { margin-top: 6px; font-size: 12px; }
.op-description summary, .op-method summary { cursor: pointer; color: var(--nav-ink); }
.op-detail { display: grid; grid-template-columns: 110px minmax(100px, 1fr); gap: 5px 10px; }
.op-detail dt { color: var(--muted); }
.op-detail dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.op-voided { opacity: 0.65; }
.op-void-label { color: var(--muted); font-size: 12px; }
.op-warning, .op-table td small.op-warning { color: var(--crit); }
.op-method { font-size: 13px; }
.op-method p { color: var(--muted); }
.op-pareto-label { min-width: 200px; position: relative; padding-bottom: 8px; }
.op-pareto-bar { display: block; height: 4px; background: var(--accent); margin-top: 5px; min-width: 1px; border-radius: 2px; }
.op-silo-connections { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.op-silo-link { border: 1px solid var(--line); background: var(--surface-2); padding: 12px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.op-silo-link b { font-family: var(--font-display); font-size: 20px; }
.op-silo-link span { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.op-line-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
.op-line { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
.op-line span, .op-line small { color: var(--muted); font-size: 12px; }
.op-process { display: flex; align-items: stretch; gap: 22px; list-style: none; padding: 12px 2px; overflow-x: auto; scrollbar-width: thin; margin: 0; }
.op-process li { position: relative; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius); padding: 14px 12px; flex: 1 0 140px; max-width: 190px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.op-process li:not(:last-child)::after { content: '→'; color: var(--muted); position: absolute; right: -20px; top: calc(50% - 12px); font-size: 21px; }
.op-stage-number { border: 1px solid var(--line); color: var(--nav-ink); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font-size: 12px; }
.op-recycling { background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 10px; font-size: 13px; line-height: 1.7; }
.fields textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 7px 9px; resize: vertical; }
@media (max-width: 560px) {
  .op-metrics { grid-template-columns: 1fr 1fr; gap: 8px; }
  .op-metric { padding: 12px; }
  .op-metric .eyebrow { font-size: 10px; }
  .op-metric > strong { font-size: 24px; }
  .op-detail { grid-template-columns: 85px minmax(100px, 1fr); }
  .op-silo-connections { grid-template-columns: 1fr 1fr; }
}

</head>

        inputMode: 'KG', inputValue: m, measuredMassKg: m, reason: 'Inventario inicial (demo)',
      });

      receptions.sort((x, y) => x.ts - y.ts).forEach((r, i) => {
        const d = time.zonedParts(r.ts, timeZone);
        const ymd = `${String(d.year).slice(2)}${String(d.month).padStart(2, '0')}${String(d.day).padStart(2, '0')}`;
        ds.receptions.push({
          id: `dm-rec-${p.silo}-${String(i + 1).padStart(2, '0')}`, createdAt: r.ts, operatorId: shiftOperator(d.hour),
          siloId, materialId: p.materialId, massKg: r.massKg, ts: r.ts,

    }

    // ── Consultas ──────────────────────────────────────────────────────────────
    /** @param {number} [at] @returns {SiloViewModel[]} */
    const plantView = (at = now()) => projection.plantView(ds, at);
    /** @param {string} siloId @param {number} [at] @returns {SiloViewModel} */
    const siloView = (siloId, at = now()) => projection.siloView(ds, siloId, at);

    /** Alertas de toda la planta: activas primero, luego por severidad y fecha. @param {number} [at] */
    function alerts(at = now()) {
      const rank = { CRITICAL: 0, WARNING: 1, INFO: 2 };
      return plantView(at)
        .flatMap((v) => v.alerts.map((a) => ({ ...a, siloName: v.silo.name })))
        .sort((a, b) => Number(b.active) - Number(a.active)
          || rank[/** @type {'CRITICAL' | 'WARNING' | 'INFO'} */ (a.severity)] - rank[/** @type {'CRITICAL' | 'WARNING' | 'INFO'} */ (b.severity)]
          || b.tStart - a.tStart);
    }

    /**
     * Línea de tiempo de un silo (todos los registros, más recientes primero).
     * @param {string} siloId @param {{from?: number, to?: number}} [range]
     */
    function timeline(siloId, { from = -Infinity, to = Infinity } = {}) {
      const valve = valveOf(siloId);
      const vid = valve ? valve.id : null;
      /** @type {{kind: string, ts: number, record: any}[]} */ const items = [
        ...ds.receptions.filter((r) => r.siloId === siloId).map((r) => ({ kind: 'RECEPTION', ts: r.ts, record: r })),
        ...ds.adjustments.filter((a) => a.siloId === siloId).map((a) => ({ kind: 'ADJUSTMENT', ts: a.ts, record: a })),
        ...ds.assignments.filter((a) => a.siloId === siloId).map((a) => ({ kind: 'ASSIGNMENT', ts: a.ts, record: a })),
        ...ds.valvePeriods.filter((p) => p.valveId === vid).map((p) => ({ kind: 'PERIOD', ts: p.start, record: p })),
        ...ds.totalizerReadings.filter((r) => r.valveId === vid).map((r) => ({ kind: 'TOTALIZER', ts: r.ts, record: r })),
      ];
      return items.filter((i) => i.ts >= from && i.ts <= to).sort((a, b) => b.ts - a.ts);
    }

    /** Balance diario de un silo en los últimos `days` días. @param {string} siloId @param {{days?: number, at?: number}} [opts] */
    function daily(siloId, { days = 30, at = now() } = {}) {
      return reports.dailyTotals(simulate(siloId, at), { timeZone: tz(), from: at - days * units.MS_PER_DAY, to: at });
    }

    /** Materiales con su versión de propiedades vigente. @param {number} [at] */
    function materials(at = now()) {
      const props = projection.materialPropsById(ds);
      return ds.materials.map((m) => ({ ...m, props: balance.versionAt(props[m.id], at) }));
    }

    // ── Recepciones ────────────────────────────────────────────────────────────
    /**
     * Valida una recepción sin guardarla y devuelve la vista previa (para el formulario).
     * @param {Record<string, any>} input
     */
    function checkReception(input) {
      /** @type {Issue[]} */ const errors = [];
      const silo = findSilo(input.siloId);
      if (!silo) return { errors: [issue('siloId', 'NOT_FOUND')], warnings: [], preview: null };
      const ts = input.ts == null ? now() : input.ts;
      errors.push(...tsIssues(ts, 'ts'));
      const material = ds.materials.find((m) => m.id === input.materialId);
      if (!material) errors.push(issue('materialId', 'NOT_FOUND'));
      if (errors.length) return { errors, warnings: [], preview: null };
      const state = stateAt(silo.id, ts);
      const v = validation.validateReception({ massKg: input.massKg, materialId: input.materialId, forced: !!input.forced, forceReason: text(input.forceReason) }, state);
      errors.push(...v.errors);
      const note = text(input.deliveryNote);
      if (note) {
        const dup = ds.receptions.find((r) => !r.voided && r.deliveryNote.trim().toLowerCase() === note.toLowerCase()
          && r.supplier.trim().toLowerCase() === text(input.supplier).toLowerCase());
        if (dup) errors.push(issue('deliveryNote', 'DUPLICATE_DELIVERY_NOTE', { receptionId: dup.id }));
      }
      const mass = isPositive(input.massKg) ? input.massKg : 0;
      const afterKg = state.capacityKg == null ? state.massKg + mass : Math.min(state.capacityKg, state.massKg + mass);
      const preview = {
        ts, beforeKg: state.massKg, afterKg, availableKg: v.availableKg, capacityKg: state.capacityKg,
        afterPct: state.capacityKg ? (afterKg / state.capacityKg) * 100 : null,
      };
      return { errors, warnings: v.warnings, preview };
    }

    /**
     * Registra la descarga de un camión/lote en un silo.
     * @param {{siloId: string, materialId: string, massKg: number, ts?: number, lot?: string, supplier?: string,
     *          deliveryNote?: string, forced?: boolean, forceReason?: string}} input
     * @returns {Promise<ServiceResult<ReceptionRecord>>}
     */
    async function registerReception(input) {
      const c = checkReception(input);
      if (c.errors.length || !c.preview) return fail(c.errors, c.warnings);
      /** @type {ReceptionRecord} */
      const record = {
        id: model.newId('rec'), ...base(), siloId: input.siloId, materialId: input.materialId, massKg: input.massKg,
        ts: c.preview.ts, lot: text(input.lot), supplier: text(input.supplier), deliveryNote: text(input.deliveryNote),
        forced: !!input.forced, forceReason: text(input.forceReason),
      };
      return create('receptions', record, [record.siloId], c.warnings);
    }

    // ── Rotativa ───────────────────────────────────────────────────────────────
    /** @param {string} valveId */
    const periodsOf = (valveId) => ds.valvePeriods.filter((p) => p.valveId === valveId && !p.voided);
    /** @param {string} valveId */
    const openPeriodOf = (valveId) => periodsOf(valveId).find((p) => p.end == null) || null;

    /**
     * Arranca la rotativa (botón ▶): abre un periodo con los kg/h del gravimétrico y/o las RPM.
     * @param {string} siloId @param {{ts?: number, flowKgH?: number | null, rpm?: number | null, note?: string, source?: ValvePeriodRecord['source']}} input
     * @returns {Promise<ServiceResult<ValvePeriodRecord>>}
     */
    async function startValve(siloId, input) {
      const silo = findSilo(siloId);
      const valve = silo && valveOf(siloId);
      if (!silo || !valve) return fail([issue('siloId', 'NOT_FOUND')]);
      const ts = input.ts == null ? now() : input.ts;
      const errors = tsIssues(ts, 'ts');
      if (errors.length) return fail(errors);
      const state = stateAt(siloId, ts);
      if (state.materialId == null) return fail([issue('siloId', 'NO_MATERIAL_ASSIGNED')]);
      const period = { start: ts, end: null, flowKgH: input.flowKgH ?? null, rpm: input.rpm ?? null };
      const v = validation.validatePeriod(period, periodsOf(valve.id));
      if (!v.ok) return fail(v.errors);
      /** @type {Issue[]} */ const warnings = state.massKg === 0 ? [issue('siloId', 'EMPTY_SILO')] : [];
      /** @type {ValvePeriodRecord} */
      const record = { id: model.newId('per'), ...base(), valveId: valve.id, ...period, source: input.source || 'BUTTON', note: text(input.note) };
      return create('valvePeriods', record, [siloId], warnings);
    }

    /**
     * Para la rotativa (botón ■): cierra el periodo abierto.
     * @param {string} siloId @param {{ts?: number}} [input]
     * @returns {Promise<ServiceResult<ValvePeriodRecord>>}
     */
    async function stopValve(siloId, input = {}) {
      const valve = valveOf(siloId);
      if (!valve) return fail([issue('siloId', 'NOT_FOUND')]);
      const open = openPeriodOf(valve.id);
      if (!open) return fail([issue('siloId', 'NO_OPEN_PERIOD')]);
      const ts = input.ts == null ? now() : input.ts;
      const errors = tsIssues(ts, 'ts');
      if (errors.length) return fail(errors);
      const closed = { ...open, end: ts };
      const v = validation.validatePeriod(closed, periodsOf(valve.id));
      if (!v.ok) return fail(v.errors);
      return update('valvePeriods', open, closed, [siloId], []);
    }

    /**
     * Cambio de flujo o RPM con la rotativa en marcha: cierra el periodo actual y abre otro en
     * el mismo instante (una sola transacción).
     * @param {string} siloId @param {{ts?: number, flowKgH?: number | null, rpm?: number | null, note?: string}} input
     * @returns {Promise<ServiceResult<ValvePeriodRecord>>}
     */
    async function changeValveFlow(siloId, input) {
      const valve = valveOf(siloId);
      if (!valve) return fail([issue('siloId', 'NOT_FOUND')]);
      const open = openPeriodOf(valve.id);
      if (!open) return fail([issue('siloId', 'NO_OPEN_PERIOD')]);
      const ts = input.ts == null ? now() : input.ts;
      const errors = tsIssues(ts, 'ts');
      if (errors.length) return fail(errors);
      const closed = { ...open, end: ts };
      const next = { start: ts, end: null, flowKgH: input.flowKgH ?? null, rpm: input.rpm ?? null };
      const vClose = validation.validatePeriod(closed, periodsOf(valve.id));
      if (!vClose.ok) return fail(vClose.errors);
      const vNext = validation.validatePeriod(next, [...periodsOf(valve.id).filter((p) => p.id !== open.id), { ...closed }]);
      if (!vNext.ok) return fail(vNext.errors);
      /** @type {ValvePeriodRecord} */
      const record = { id: model.newId('per'), ...base(), valveId: valve.id, ...next, source: 'BUTTON', note: text(input.note) };
      const changes = [{ collection: /** @type {CollectionName} */ ('valvePeriods'), record: closed }, { collection: /** @type {CollectionName} */ ('valvePeriods'), record }];
      const history = historyWarnings([siloId], changes);
      const err = await commit(changes, [audit('valvePeriods', open.id, 'UPDATE', open, closed), audit('valvePeriods', record.id, 'CREATE', null, record)]);
      return err || ok(record, history);
    }

    /**
     * Periodo cargado a mano (retroactivo, abierto o cerrado).
     * @param {string} siloId @param {{start: number, end: number | null, flowKgH?: number | null, rpm?: number | null, note?: string}} input
     * @returns {Promise<ServiceResult<ValvePeriodRecord>>}
     */
    async function registerPeriod(siloId, input) {
      const valve = valveOf(siloId);
      if (!valve) return fail([issue('siloId', 'NOT_FOUND')]);
      const errors = [...tsIssues(input.start, 'start'), ...(input.end == null ? [] : tsIssues(input.end, 'end'))];
      if (errors.length) return fail(errors);
      const period = { start: input.start, end: input.end ?? null, flowKgH: input.flowKgH ?? null, rpm: input.rpm ?? null };
      const v = validation.validatePeriod(period, periodsOf(valve.id));
      if (!v.ok) return fail(v.errors);
      /** @type {ValvePeriodRecord} */
      const record = { id: model.newId('per'), ...base(), valveId: valve.id, ...period, source: 'MANUAL', note: text(input.note) };
      return create('valvePeriods', record, [siloId], []);
    }

    /**
     * Lectura del totalizador del gravimétrico (kg acumulados). Debe ser monótona.
     * @param {string} siloId @param {{ts?: number, totalKg: number, note?: string}} input
     * @returns {Promise<ServiceResult<TotalizerReadingRecord>>}
     */
    async function registerTotalizerReading(siloId, input) {
      const valve = valveOf(siloId);
      if (!valve) return fail([issue('siloId', 'NOT_FOUND')]);
      const ts = input.ts == null ? now() : input.ts;
      const errors = tsIssues(ts, 'ts');
      if (!isFiniteNumber(input.totalKg) || input.totalKg < 0) errors.push(issue('totalKg', 'MUST_BE_NON_NEGATIVE'));
      if (errors.length) return fail(errors);
      const readings = ds.totalizerReadings.filter((r) => r.valveId === valve.id && !r.voided);
      const prev = readings.filter((r) => r.ts <= ts).sort((a, b) => b.ts - a.ts)[0];
      const next = readings.filter((r) => r.ts > ts).sort((a, b) => a.ts - b.ts)[0];
      if (prev && input.totalKg < prev.totalKg) return fail([issue('totalKg', 'TOTALIZER_DECREASED', { previousKg: prev.totalKg })]);
      if (next && input.totalKg > next.totalKg) return fail([issue('totalKg', 'TOTALIZER_NOT_MONOTONIC', { nextKg: next.totalKg })]);
      /** @type {TotalizerReadingRecord} */
      const record = { id: model.newId('tot'), ...base(), valveId: valve.id, ts, totalKg: input.totalKg, note: text(input.note) };
      return create('totalizerReadings', record, [siloId], []);
    }

    // ── Ajustes y material ─────────────────────────────────────────────────────
    /**
     * Valida un ajuste y calcula la masa medida y la diferencia con la estimación.
     * @param {Record<string, any>} input
     */
    function checkAdjustment(input) {
      const silo = findSilo(input.siloId);
      if (!silo) return { errors: [issue('siloId', 'NOT_FOUND')], warnings: [], preview: null };
      const ts = input.ts == null ? now() : input.ts;
      /** @type {Issue[]} */ const errors = tsIssues(ts, 'ts');
      if (!(/** @type {readonly string[]} */ (model.ADJUSTMENT_TYPES)).includes(input.type)) errors.push(issue('type', 'UNKNOWN_TYPE'));
      const empty = input.type === 'EMPTY';
      const inputMode = empty ? 'KG' : input.inputMode;
      const inputValue = empty ? 0 : input.inputValue;
      if (!(/** @type {readonly string[]} */ (model.MEASUREMENT_INPUTS)).includes(inputMode)) errors.push(issue('inputMode', 'UNKNOWN_MODE'));
      if (errors.length) return { errors, warnings: [], preview: null };
      const state = stateAt(silo.id, ts);
      const m = geometry.massFromMeasurement(geometry.createGeometry(silo.geometry), state.bulkDensityKgM3, inputMode, inputValue);
      errors.push(...m.issues.map((i) => ({ ...i, field: 'inputValue' })));
      if (m.massKg == null) return { errors, warnings: [], preview: null };
      const v = validation.validateAdjustment({ measuredMassKg: m.massKg, reason: input.reason }, state);
      errors.push(...v.errors);
      const deltaKg = m.massKg - state.massKg;
      return {
        errors,
        warnings: v.warnings,
        preview: {
          ts, inputMode, inputValue, estimatedKg: state.massKg, measuredKg: m.massKg, deltaKg,
          deltaPct: state.massKg > 0 ? (deltaKg / state.massKg) * 100 : null,
        },
      };
    }

    /**
     * Ajuste de inventario (medición con cinta/sonda, vaciado total, conciliación). Reinicia la
     * estimación y guarda la estimación previa como traza de la deriva.
     * @param {{siloId: string, ts?: number, type: AdjustmentRecord['type'], inputMode?: AdjustmentRecord['inputMode'], inputValue?: number, reason: string}} input
     * @returns {Promise<ServiceResult<AdjustmentRecord>>}
     */
    async function registerAdjustment(input) {
      const c = checkAdjustment(input);
      if (c.errors.length || !c.preview) return fail(c.errors, c.warnings);
      const p = c.preview;
      /** @type {AdjustmentRecord} */
      const record = {
        id: model.newId('adj'), ...base(), siloId: input.siloId, ts: p.ts, type: input.type,
        inputMode: p.inputMode, inputValue: p.inputValue, measuredMassKg: p.measuredKg,
        estimatedKgAtEntry: p.estimatedKg, reason: text(input.reason),
      };
      return create('adjustments', record, [record.siloId], c.warnings);
    }

    /**
     * Asigna (o quita) el material de un silo. Solo con el silo vacío.
     * @param {string} siloId @param {{materialId: string | null, ts?: number, reason?: string}} input
     * @returns {Promise<ServiceResult<AssignmentRecord>>}
     */
    async function assignMaterial(siloId, input) {
      const silo = findSilo(siloId);
      if (!silo) return fail([issue('siloId', 'NOT_FOUND')]);
      const ts = input.ts == null ? now() : input.ts;
      const errors = tsIssues(ts, 'ts');
      if (input.materialId != null) {
        const mat = ds.materials.find((m) => m.id === input.materialId);
        if (!mat) errors.push(issue('materialId', 'NOT_FOUND'));
        else if (!mat.active) errors.push(issue('materialId', 'INACTIVE'));
        else if (!balance.versionAt(ds.materialProps.filter((p) => p.materialId === input.materialId && !p.voided), ts)) errors.push(issue('materialId', 'MISSING_MATERIAL_PROPS'));
      }
      if (errors.length) return fail(errors);
      const v = validation.validateMaterialChange(input.materialId, stateAt(siloId, ts));
      if (!v.ok) return fail(v.errors);
      /** @type {AssignmentRecord} */
      const record = { id: model.newId('asg'), ...base(), siloId, materialId: input.materialId, ts, reason: text(input.reason) };
      return create('assignments', record, [siloId], []);
    }

    // ── Anulación y alertas ────────────────────────────────────────────────────
    /**
     * Anula un registro de evento (nunca se borra). Exige motivo.
     * @param {{collection: CollectionName, id: string, reason: string}} input
     * @returns {Promise<ServiceResult<any>>}
     */
    async function voidRecord({ collection, id, reason }) {
      if (!VOIDABLE.includes(collection)) return fail([issue('collection', 'NOT_VOIDABLE')]);
      const list = /** @type {any[]} */ (ds[collection]);
      const rec = list.find((r) => r.id === id);
      if (!rec) return fail([issue('id', 'NOT_FOUND')]);
      if (rec.voided) return fail([issue('id', 'ALREADY_VOIDED')]);
      if (isBlank(reason)) return fail([issue('reason', 'REQUIRED')]);
      if (collection === 'materialProps' || collection === 'valveConfigs') {
        const owner = collection === 'materialProps' ? 'materialId' : 'valveId';
        const siblings = list.filter((r) => r[owner] === rec[owner] && !r.voided);
        if (siblings.length <= 1) return fail([issue('id', 'LAST_VERSION')]);
      }
      const after = { ...rec, voided: true, voidReason: text(reason), voidedAt: now(), voidedBy: operatorId };
      if (collection === 'scrapMovements') {
        const errors = operations.scrapHistoryErrors(withChanges([{ collection, record: after }]));
        if (errors.length) return fail(errors);
      }
      const siloIds = rec.siloId ? [rec.siloId]
        : rec.valveId ? [/** @type {string} */ (siloOfValve(rec.valveId))]
          : ds.silos.map((s) => s.id);
      return update(collection, rec, after, siloIds, [], 'VOID');
    }

    /**
     * Reconoce una alerta (ISA-18.2): queda registrada quién y cuándo.
     * @param {string} alertId @param {{note?: string}} [input]
     * @returns {Promise<ServiceResult<AlertStateRecord>>}
     */
    async function acknowledgeAlert(alertId, input = {}) {
      const alert = alerts().find((a) => a.id === alertId);
      if (!alert) return fail([issue('alertId', 'NOT_FOUND')]);
      if (alert.acknowledged) return fail([issue('alertId', 'ALREADY_ACKNOWLEDGED')]);
      /** @type {AlertStateRecord} */
      const record = { id: model.newId('ack'), ...base(), alertId, siloId: alert.siloId, rule: alert.rule, state: 'ACK', ackAt: now(), note: text(input.note) };
      return create('alertStates', record, [], []);
    }

    // ── Catálogos ──────────────────────────────────────────────────────────────
    /**
     * @param {{name: string, realDensityGcm3: number, bulkDensityKgM3: number, supplier?: string, description?: string,
     *          color?: string, source?: MaterialPropsRecord['source'], effectiveFrom?: number}} input
     * @returns {Promise<ServiceResult<MaterialRecord>>}
     */
    async function createMaterial(input) {
      if (/** @type {any} */ (input).catalogOnly === true) {
        const errors = required(input, ['name']);
        if (nameTaken(ds.materials, text(input.name))) errors.push(issue('name', 'DUPLICATE_NAME'));
        if (/** @type {any} */ (input).code && ds.materials.some((m) => m.code === text(/** @type {any} */ (input).code))) errors.push(issue('code', 'DUPLICATE_NAME'));
        if (errors.length) return fail(errors);
        /** @type {MaterialRecord} */
        const material = { id: model.newId('mat'), ...base(), name: text(input.name), supplier: text(input.supplier), description: text(input.description), color: input.color || model.MATERIAL_PALETTE[0], active: true,
          code: text(/** @type {any} */ (input).code), family: text(/** @type {any} */ (input).family), aliases: text(/** @type {any} */ (input).aliases) };
        return create('materials', material, [], []);
      }
      const v = validation.validateMaterial(input);
      const errors = [...v.errors];
      if (!isBlank(input.name) && nameTaken(ds.materials, input.name)) errors.push(issue('name', 'DUPLICATE_NAME'));
      const source = input.source || 'PROVISIONAL';
      if (!(/** @type {readonly string[]} */ (model.PROPS_SOURCES)).includes(source)) errors.push(issue('source', 'UNKNOWN_SOURCE'));
      if (errors.length) return fail(errors, v.warnings);
      const used = new Set(ds.materials.map((m) => m.color));
      const color = input.color || model.MATERIAL_PALETTE.find((c) => !used.has(c)) || model.MATERIAL_PALETTE[0];
      /** @type {MaterialRecord} */
      const material = { id: model.newId('mat'), ...base(), name: text(input.name), supplier: text(input.supplier), description: text(input.description), color, active: true,
        code: text(/** @type {any} */ (input).code), family: text(/** @type {any} */ (input).family), aliases: text(/** @type {any} */ (input).aliases) };
      /** @type {MaterialPropsRecord} */
      const props = {
        id: model.newId('props'), ...base(), materialId: material.id, effectiveFrom: input.effectiveFrom ?? now(),
        realDensityGcm3: input.realDensityGcm3, bulkDensityKgM3: input.bulkDensityKgM3, source, note: '',
      };
      const err = await commit(
        [{ collection: 'materials', record: material }, { collection: 'materialProps', record: props }],
        [audit('materials', material.id, 'CREATE', null, material), audit('materialProps', props.id, 'CREATE', null, props)],
      );
      return err || ok(material, v.warnings);
    }

    /**
     * @param {string} id @param {{name?: string, supplier?: string, description?: string, color?: string, active?: boolean}} patch
     * @returns {Promise<ServiceResult<MaterialRecord>>}
     */
    async function updateMaterial(id, patch) {
      const before = ds.materials.find((m) => m.id === id);
      if (!before) return fail([issue('id', 'NOT_FOUND')]);
      const after = { ...before };
      if (patch.name !== undefined) after.name = text(patch.name);
      if (patch.supplier !== undefined) after.supplier = text(patch.supplier);
      if (patch.description !== undefined) after.description = text(patch.description);
      if (patch.color !== undefined) after.color = patch.color;
      if (patch.active !== undefined) after.active = !!patch.active;
      for (const field of ['code', 'family', 'aliases']) if (field in patch) /** @type {any} */ (after)[field] = text(/** @type {any} */ (patch)[field]);
      if (after.code && ds.materials.some((m) => m.id !== id && m.code === after.code)) return fail([issue('code', 'DUPLICATE_NAME')]);
      if (isBlank(after.name)) return fail([issue('name', 'REQUIRED')]);
      if (nameTaken(ds.materials, after.name, id)) return fail([issue('name', 'DUPLICATE_NAME')]);
      if (before.active && !after.active) {
        const inUse = plantView().some((v) => v.sim.state.materialId === id);
        if (inUse) return fail([issue('active', 'MATERIAL_IN_USE')]);
      }
      return update('materials', before, after, [], []);
    }

    /**
     * Nueva versión de densidades (p. ej. llegó la ficha técnica). Rige desde `effectiveFrom`.
     * @param {string} materialId
     * @param {{realDensityGcm3: number, bulkDensityKgM3: number, source: MaterialPropsRecord['source'], effectiveFrom?: number, note?: string}} input
     * @returns {Promise<ServiceResult<MaterialPropsRecord>>}
     */
    async function addMaterialProps(materialId, input) {
      const material = ds.materials.find((m) => m.id === materialId);
      if (!material) return fail([issue('materialId', 'NOT_FOUND')]);
      const v = validation.validateMaterial({ name: material.name, ...input });
      const errors = [...v.errors];
      if (!(/** @type {readonly string[]} */ (model.PROPS_SOURCES)).includes(input.source)) errors.push(issue('source', 'UNKNOWN_SOURCE'));
      const effectiveFrom = input.effectiveFrom ?? now();
      errors.push(...tsIssues(effectiveFrom, 'effectiveFrom'));
      if (errors.length) return fail(errors, v.warnings);
      const warnings = [...v.warnings];
      if (effectiveFrom < now() - units.MS_PER_MINUTE) warnings.push(issue('effectiveFrom', 'RETROACTIVE_CHANGE'));
      /** @type {MaterialPropsRecord} */
      const record = {
        id: model.newId('props'), ...base(), materialId, effectiveFrom,
        realDensityGcm3: input.realDensityGcm3, bulkDensityKgM3: input.bulkDensityKgM3, source: input.source, note: text(input.note),
      };
      const affected = plantView().filter((x) => x.sim.state.materialId === materialId).map((x) => x.silo.id);
      return create('materialProps', record, affected, warnings);
    }

    /**
     * Silo nuevo con su rotativa y configuración estimada. Acepta altura del cono o ángulo.
     * @param {{name: string, geometry: Record<string, any>, alarmLowPct?: number, alarmHighPct?: number, geometryEstimated?: boolean}} input
     * @returns {Promise<ServiceResult<SiloRecord>>}
     */
    async function createSilo(input) {
      const draft = {
        name: text(input.name), geometry: geometryFromInput(input.geometry),
        alarmLowPct: input.alarmLowPct ?? Number(model.setting(ds, 'alarmLowPct')),
        alarmHighPct: input.alarmHighPct ?? Number(model.setting(ds, 'alarmHighPct')),
      };
      const v = validation.validateSilo(draft);
      const errors = [...v.errors];
      if (draft.name && nameTaken(ds.silos, draft.name)) errors.push(issue('name', 'DUPLICATE_NAME'));
      if (errors.length) return fail(errors);
      const n = ds.silos.length + 1;
      const plant = ds.plants[0];
      /** @type {SiloRecord} */
      const silo = {
        id: model.newId('silo'), ...base(), plantId: plant ? plant.id : seed.PLANT_ID, ...draft,
        order: Math.max(0, ...ds.silos.map((s) => s.order)) + 1,
        geometryEstimated: input.geometryEstimated ?? true, inventorySource: 'ESTIMATED', active: true,
      };
      /** @type {ValveRecord} */
      const valve = { id: model.newId('valve'), ...base(), siloId: silo.id, tag: `RV-${String(n).padStart(2, '0')}` };
      /** @type {ValveConfigRecord} */
      const cfg = {
        id: model.newId('vcfg'), ...base(), valveId: valve.id, effectiveFrom: now(),
        mode: /** @type {'DIRECT'} */ (model.PROVISIONAL_VALVE.mode), vRevM3: model.PROVISIONAL_VALVE.vRevM3,
        eta: model.PROVISIONAL_VALVE.eta, source: 'ESTIMATED', calibrationId: null,
      };
      const err = await commit(
        [{ collection: 'silos', record: silo }, { collection: 'valves', record: valve }, { collection: 'valveConfigs', record: cfg }],
        [audit('silos', silo.id, 'CREATE', null, silo), audit('valves', valve.id, 'CREATE', null, valve), audit('valveConfigs', cfg.id, 'CREATE', null, cfg)],
      );
      return err || ok(silo);
    }

    /**
     * Edita nombre, geometría (por teclado), alarmas, orden o estado del silo.
     * @param {string} id
     * @param {{name?: string, geometry?: Record<string, any>, alarmLowPct?: number, alarmHighPct?: number,
     *          geometryEstimated?: boolean, order?: number, active?: boolean}} patch
     * @returns {Promise<ServiceResult<SiloRecord>>}
     */
    async function updateSilo(id, patch) {
      const before = findSilo(id);
      if (!before) return fail([issue('id', 'NOT_FOUND')]);
      const after = { ...before };
      if (patch.name !== undefined) after.name = text(patch.name);
      if (patch.geometry !== undefined) after.geometry = geometryFromInput(patch.geometry);
      if (patch.alarmLowPct !== undefined) after.alarmLowPct = patch.alarmLowPct;
      if (patch.alarmHighPct !== undefined) after.alarmHighPct = patch.alarmHighPct;
      if (patch.geometryEstimated !== undefined) after.geometryEstimated = !!patch.geometryEstimated;
      if (patch.order !== undefined) after.order = patch.order;
      if (patch.active !== undefined) after.active = !!patch.active;
      const v = validation.validateSilo(after);
      const errors = [...v.errors];
      if (after.name && nameTaken(ds.silos, after.name, id)) errors.push(issue('name', 'DUPLICATE_NAME'));
      if (errors.length) return fail(errors);
      const state = stateAt(id, now());
      if (before.active && !after.active) {
        if (state.valveRunning) return fail([issue('active', 'VALVE_RUNNING')]);
        if (state.massKg > validation.EMPTY_TOLERANCE_KG) return fail([issue('active', 'SILO_NOT_EMPTY', { massKg: state.massKg })]);
      }
      /** @type {Issue[]} */ const warnings = [];
      if (patch.geometry !== undefined && state.bulkDensityKgM3) {
        const capacityKg = geometry.createGeometry(after.geometry).totalVolumeM3 * state.bulkDensityKgM3;
        if (state.massKg > capacityKg) warnings.push(issue('geometry', 'ABOVE_CAPACITY_AFTER_CHANGE', { massKg: state.massKg, capacityKg }));
      }
      return update('silos', before, after, [id], warnings);
    }

    /**
     * Nueva versión de configuración de la rotativa (modo, V_rev, η).
     * @param {string} siloId
     * @param {{mode: ValveConfigRecord['mode'], vRevM3?: number | null, eta?: number | null, effectiveFrom?: number,
     *          source?: ValveConfigRecord['source'], calibrationId?: string | null}} input
     * @returns {Promise<ServiceResult<ValveConfigRecord>>}
     */
    async function setValveConfig(siloId, input) {
      const valve = valveOf(siloId);
      if (!valve) return fail([issue('siloId', 'NOT_FOUND')]);
      const v = validation.validateValveConfig(input);
      const effectiveFrom = input.effectiveFrom ?? now();
      const errors = [...v.errors, ...tsIssues(effectiveFrom, 'effectiveFrom')];
      const source = input.source || 'MANUAL';
      if (!(/** @type {readonly string[]} */ (model.VALVE_CONFIG_SOURCES)).includes(source)) errors.push(issue('source', 'UNKNOWN_SOURCE'));
      if (errors.length) return fail(errors);
      /** @type {Issue[]} */ const warnings = effectiveFrom < now() - units.MS_PER_MINUTE ? [issue('effectiveFrom', 'RETROACTIVE_CHANGE')] : [];
      /** @type {ValveConfigRecord} */
      const record = {
        id: model.newId('vcfg'), ...base(), valveId: valve.id, effectiveFrom, mode: input.mode,
        vRevM3: input.vRevM3 ?? null, eta: input.eta ?? null, source, calibrationId: input.calibrationId ?? null,
      };
      return create('valveConfigs', record, [siloId], warnings);
    }

    /**
     * @param {{name: string, role?: OperatorRecord['role']}} input
     * @returns {Promise<ServiceResult<OperatorRecord>>}
     */
    async function createOperator(input) {
      if (isBlank(input.name)) return fail([issue('name', 'REQUIRED')]);
      const role = input.role || 'OPERATOR';
      if (!(/** @type {readonly string[]} */ (model.OPERATOR_ROLES)).includes(role)) return fail([issue('role', 'UNKNOWN_ROLE')]);
      if (nameTaken(ds.operators, input.name)) return fail([issue('name', 'DUPLICATE_NAME')]);
      /** @type {OperatorRecord} */
      const record = { id: model.newId('op'), ...base(), name: text(input.name), role, active: true };
      return create('operators', record, [], []);
    }

    /**
     * @param {string} id @param {{name?: string, role?: OperatorRecord['role'], active?: boolean}} patch
     * @returns {Promise<ServiceResult<OperatorRecord>>}
     */
    async function updateOperator(id, patch) {
      const before = ds.operators.find((o) => o.id === id);
      if (!before) return fail([issue('id', 'NOT_FOUND')]);
      const after = { ...before, ...(patch.name !== undefined ? { name: text(patch.name) } : {}), ...(patch.role ? { role: patch.role } : {}), ...(patch.active !== undefined ? { active: !!patch.active } : {}) };
      if (isBlank(after.name)) return fail([issue('name', 'REQUIRED')]);
      if (nameTaken(ds.operators, after.name, id)) return fail([issue('name', 'DUPLICATE_NAME')]);
      if (!(/** @type {readonly string[]} */ (model.OPERATOR_ROLES)).includes(after.role)) return fail([issue('role', 'UNKNOWN_ROLE')]);
      if (before.active && !after.active && ds.operators.filter((o) => o.active).length <= 1) return fail([issue('active', 'LAST_ACTIVE_OPERATOR')]);
      return update('operators', before, after, [], []);
    }

    /**
     * Ajustes generales (idioma, formato numérico, alarmas por defecto, semáforo, zona horaria…).
     * @param {Record<string, unknown>} patch
     * @returns {Promise<ServiceResult<Record<string, unknown>>>}
     */
    async function updateSettings(patch) {
      /** @type {Issue[]} */ const errors = [];
      for (const [key, value] of Object.entries(patch)) {
        const rule = /** @type {Record<string, (v: unknown) => boolean>} */ (SETTING_RULES)[key];
        if (!rule) errors.push(issue(key, 'UNKNOWN_SETTING'));
        else if (!rule(value)) errors.push(issue(key, 'INVALID_VALUE'));
      }
      const merged = (/** @type {string} */ k) => (k in patch ? patch[k] : model.setting(ds, k));
      if (Number(merged('alarmLowPct')) >= Number(merged('alarmHighPct'))) errors.push(issue('alarmLowPct', 'LOW_NOT_BELOW_HIGH'));
      if (Number(merged('semaphoreRedHours')) >= Number(merged('semaphoreYellowHours'))) errors.push(issue('semaphoreRedHours', 'RED_NOT_BELOW_YELLOW'));
      if (errors.length) return fail(errors);
      /** @type {RepositoryChange[]} */ const changes = [];
      /** @type {AuditRecord[]} */ const audits = [];
      for (const [key, value] of Object.entries(patch)) {
        const before = ds.settings.find((s) => s.id === key) || null;
        const record = { id: key, value };
        changes.push({ collection: 'settings', record });
        audits.push(audit('settings', key, before ? 'UPDATE' : 'CREATE', before, record));
      }
      const err = await commit(changes, audits);
      return err || ok(patch);
    }

    // ── Operaciones de planta ────────────────────────────────────────────────
    /** @param {any} input @param {string[]} fields @returns {Issue[]} */
    const required = (input, fields) => fields.filter((f) => isBlank(input[f])).map((f) => issue(f, 'REQUIRED'));
    /** @param {any} input @param {boolean} [optional] @returns {Issue[]} */
    const lineIssues = (input, optional = false) => !input.lineId && optional ? []
      : ds.productionLines.some((l) => l.id === input.lineId && l.active) ? [] : [issue('lineId', 'NOT_FOUND')];
    /** @param {any} input @param {boolean} [open] @returns {Issue[]} */
    const windowIssues = (input, open = false) => {
      const errors = tsIssues(input.start, 'start');
      if (input.end == null && open) return errors;
      errors.push(...tsIssues(input.end, 'end'));
      if (isFiniteNumber(input.start) && isFiniteNumber(input.end) && input.end <= input.start) errors.push(issue('end', 'END_NOT_AFTER_START'));
      return errors;
    };
    /** @param {any} input @returns {Promise<ServiceResult<ProductionLineRecord>>} */
    async function createProductionLine(input) {
      const errors = required(input, ['name']);
      if (nameTaken(ds.productionLines, text(input.name))) errors.push(issue('name', 'DUPLICATE_NAME'));
      if (errors.length) return fail(errors);
      const record = { id: model.newId('line'), ...base(), name: text(input.name), manufacturer: text(input.manufacturer), process: text(input.process) || 'BOPP', active: true };
      return create('productionLines', record, [], []);
    }
    /** @param {any} input @returns {Promise<ServiceResult<LineFeedingRecord>>} */
    async function registerLineFeeding(input) {
      const errors = [...lineIssues(input), ...windowIssues(input, true), ...required(input, ['note'])];
      if (!ds.silos.some((s) => s.id === input.siloId && s.active)) errors.push(issue('siloId', 'NOT_FOUND'));
      const end = input.end ?? Infinity;
      if (ds.lineFeedings.some((f) => !f.voided && f.siloId === input.siloId && f.lineId === input.lineId && f.start < end && input.start < (f.end ?? Infinity))) errors.push(issue('start', 'OVERLAPPING_PERIOD'));
      if (errors.length) return fail(errors);
      const record = { id: model.newId('feed'), ...base(), siloId: input.siloId, lineId: input.lineId, start: input.start, end: input.end ?? null, note: text(input.note) };
      return create('lineFeedings', record, [], []);
    }
    /** @param {any} input @returns {Promise<ServiceResult<PlantEventRecord>>} */
    async function registerPlantEvent(input) {
      const errors = [...lineIssues(input, true), ...windowIssues(input, true), ...required(input, ['description'])];
      const category = input.category || 'OTHER';
      const status = input.status || (input.end == null ? 'OPEN' : 'CLOSED');
      if (!['DOWNTIME', 'QUALITY', 'MAINTENANCE', 'PROCESS', 'SAFETY', 'OTHER'].includes(category)) errors.push(issue('category', 'INVALID_VALUE'));
      if (!['OPEN', 'CLOSED'].includes(status) || (status === 'CLOSED' && input.end == null)) errors.push(issue('end', 'REQUIRED'));
      if (category === 'DOWNTIME' && !input.lineId) errors.push(issue('lineId', 'REQUIRED'));
      if (input.siloId && !ds.silos.some((s) => s.id === input.siloId && s.active)) errors.push(issue('siloId', 'NOT_FOUND'));
      for (const field of ['speedMMin', 'outputRateKgH', 'recordedScrapKg']) if (input[field] != null && (!isFiniteNumber(input[field]) || input[field] < 0)) errors.push(issue(field, 'INVALID_VALUE'));
      const scrapBasis = input.scrapBasis || 'UNSPECIFIED';
      if (!['MEASURED', 'ESTIMATED', 'UNSPECIFIED'].includes(scrapBasis)) errors.push(issue('scrapBasis', 'INVALID_VALUE'));
      if (errors.length) return fail(errors);
      /** @type {PlantEventRecord} */
      const record = { id: model.newId('evt'), ...base(), lineId: input.lineId || null, siloId: input.siloId || null, start: input.start, end: input.end ?? null,
        shift: text(input.shift), category, equipment: text(input.equipment), description: text(input.description), cause: text(input.cause), action: text(input.action), responsible: text(input.responsible), status,
        eventName: text(input.eventName), sourceCategory: text(input.sourceCategory), workOrder: text(input.workOrder), roll: text(input.roll), reference: text(input.reference), component: text(input.component), subcomponent: text(input.subcomponent), productionError: text(input.productionError),
        speedMMin: input.speedMMin ?? null, lowSpeedCause: text(input.lowSpeedCause), outputRateKgH: input.outputRateKgH ?? null, recordedScrapKg: input.recordedScrapKg ?? null, scrapBasis };
      return create('plantEvents', record, [], []);
    }
    /** @param {string} id @param {Partial<PlantEventRecord>} patch @returns {Promise<ServiceResult<PlantEventRecord>>} */
    async function updatePlantEvent(id, patch) {
      const before = ds.plantEvents.find((e) => e.id === id && !e.voided);
      if (!before) return fail([issue('id', 'NOT_FOUND')]);
      const after = { ...before };
      for (const field of ['cause', 'action', 'responsible', 'description', 'equipment', 'status', 'eventName', 'sourceCategory', 'workOrder', 'roll', 'reference', 'component', 'subcomponent', 'productionError', 'shift', 'lowSpeedCause', 'scrapBasis']) if (field in patch) /** @type {any} */ (after)[field] = text(/** @type {any} */ (patch)[field]);
      for (const field of ['speedMMin', 'outputRateKgH', 'recordedScrapKg']) if (field in patch) /** @type {any} */ (after)[field] = /** @type {any} */ (patch)[field];
      if ('end' in patch) after.end = patch.end ?? null;
      if ('start' in patch) after.start = /** @type {number} */ (patch.start);
      if ('lineId' in patch) after.lineId = patch.lineId || null;
      if ('siloId' in patch) after.siloId = patch.siloId || null;
      if ('category' in patch) after.category = /** @type {PlantEventRecord['category']} */ (patch.category);
      const errors = [...windowIssues(after, true), ...required(after, ['description']), ...lineIssues(after, true)];
      if (!['DOWNTIME', 'QUALITY', 'MAINTENANCE', 'PROCESS', 'SAFETY', 'OTHER'].includes(after.category)) errors.push(issue('category', 'INVALID_VALUE'));
      if (after.category === 'DOWNTIME' && !after.lineId) errors.push(issue('lineId', 'REQUIRED'));
      if (after.siloId && !ds.silos.some((s) => s.id === after.siloId && s.active)) errors.push(issue('siloId', 'NOT_FOUND'));
      if (!['OPEN', 'CLOSED'].includes(after.status) || (after.status === 'CLOSED' && after.end == null)) errors.push(issue('end', 'REQUIRED'));
      for (const field of ['speedMMin', 'outputRateKgH', 'recordedScrapKg']) if (/** @type {any} */ (after)[field] != null && (!isFiniteNumber(/** @type {any} */ (after)[field]) || /** @type {any} */ (after)[field] < 0)) errors.push(issue(field, 'INVALID_VALUE'));
      if (!['MEASURED', 'ESTIMATED', 'UNSPECIFIED'].includes(after.scrapBasis)) errors.push(issue('scrapBasis', 'INVALID_VALUE'));
      if (errors.length) return fail(errors);
      return update('plantEvents', before, after, [], []);
    }
    /** @param {any} input @returns {Promise<ServiceResult<ProductionRunRecord>>} */
    async function registerProductionRun(input) {
      const errors = [...lineIssues(input), ...windowIssues(input)];
      for (const field of ['plannedMinutes', 'operatingMinutes', 'totalKg', 'goodKg']) {
        if (!isFiniteNumber(input[field]) || input[field] < 0) errors.push(issue(field, 'INVALID_VALUE'));
      }
      if (!isPositive(input.idealRateKgH)) errors.push(issue('idealRateKgH', 'MUST_BE_POSITIVE'));
      if (input.plannedMinutes <= 0 || input.plannedMinutes > (input.end - input.start) / units.MS_PER_MINUTE + 1e-6) errors.push(issue('plannedMinutes', 'INVALID_VALUE'));
      if (input.operatingMinutes > input.plannedMinutes) errors.push(issue('operatingMinutes', 'INVALID_VALUE'));
      if (input.goodKg > input.totalKg || (input.operatingMinutes === 0 && input.totalKg > 0)) errors.push(issue('goodKg', 'INVALID_VALUE'));
      if (input.materialId && !ds.materials.some((m) => m.id === input.materialId && m.active)) errors.push(issue('materialId', 'NOT_FOUND'));
      if (ds.productionRuns.some((r) => !r.voided && r.lineId === input.lineId && r.start < input.end && input.start < r.end)) errors.push(issue('start', 'OVERLAPPING_PERIOD'));
      if (errors.length) return fail(errors);
      /** @type {ProductionRunRecord} */
      const record = { id: model.newId('run'), ...base(), lineId: input.lineId, materialId: input.materialId || null, start: input.start, end: input.end, shift: text(input.shift), order: text(input.order),
        plannedMinutes: input.plannedMinutes, operatingMinutes: input.operatingMinutes, idealRateKgH: input.idealRateKgH, totalKg: input.totalKg, goodKg: input.goodKg, note: text(input.note) };
      const warnings = input.totalKg > input.operatingMinutes / 60 * input.idealRateKgH ? [issue('idealRateKgH', 'PERFORMANCE_ABOVE_IDEAL')] : [];
      return create('productionRuns', record, [], warnings);
    }
    /** @param {any} input @returns {Promise<ServiceResult<ScrapLotRecord>>} */
    async function createScrapLot(input) {
      const errors = [...required(input, ['code', 'category', 'location', 'recipient', 'presentation']), ...lineIssues(input, true)];
      if (ds.scrapLots.some((l) => l.code.toLowerCase() === text(input.code).toLowerCase())) errors.push(issue('code', 'DUPLICATE_NAME'));
      if (input.materialId && !ds.materials.some((m) => m.id === input.materialId && m.active)) errors.push(issue('materialId', 'NOT_FOUND'));
      const status = input.status || 'BLOCKED';
      if (!['AVAILABLE', 'BLOCKED'].includes(status)) errors.push(issue('status', 'INVALID_VALUE'));
      if (errors.length) return fail(errors);
      /** @type {ScrapLotRecord} */
      const record = { id: model.newId('scrap'), ...base(), code: text(input.code), category: text(input.category), materialId: input.materialId || null, lineId: input.lineId || null,
        location: text(input.location), recipient: text(input.recipient), presentation: text(input.presentation), status, source: text(input.source) };
      return create('scrapLots', record, [], []);
    }
    /** @param {string} id @param {Partial<ScrapLotRecord> & {reason?: string}} patch @returns {Promise<ServiceResult<ScrapLotRecord>>} */
    async function updateScrapLot(id, patch) {
      const before = ds.scrapLots.find((l) => l.id === id);
      if (!before) return fail([issue('id', 'NOT_FOUND')]);
      const after = { ...before, lastChangeReason: text(patch.reason) };
      for (const field of ['code', 'category', 'location', 'recipient', 'presentation', 'status', 'source']) if (field in patch) /** @type {any} */ (after)[field] = text(/** @type {any} */ (patch)[field]);
      if ('lineId' in patch) after.lineId = patch.lineId || null;
      if ('materialId' in patch) after.materialId = patch.materialId || null;
      const errors = [...required(after, ['code', 'category', 'location', 'recipient', 'presentation']), ...required(patch, ['reason']), ...lineIssues(after, true)];
      if (ds.scrapLots.some((l) => l.id !== id && l.code.toLowerCase() === after.code.toLowerCase())) errors.push(issue('code', 'DUPLICATE_NAME'));
      if (after.materialId && !ds.materials.some((m) => m.id === after.materialId && m.active)) errors.push(issue('materialId', 'NOT_FOUND'));
      if (!['AVAILABLE', 'BLOCKED'].includes(after.status)) errors.push(issue('status', 'INVALID_VALUE'));
      if (errors.length) return fail(errors);
      return update('scrapLots', before, after, [], []);
    }
    /** Importación atómica de un conteo histórico; se revisa otra vez al guardar.
     * @param {string} csv @param {{numberFormat:'es'|'en',source:string}} opts */
    async function importScrapCsv(csv, opts) {
      const parsed = scrapImport.parse(csv, ds, { ...opts, timeZone: tz() });
      if (!parsed.ok) return fail(parsed.errors);
      /** @type {Issue[]} */ const errors = [];
      /** @type {RepositoryChange[]} */ const changes = [];
      /** @type {AuditRecord[]} */ const audits = [];
      for (const row of parsed.rows) {
        errors.push(...tsIssues(row.movement.ts, 'file'));
        const lot = { ...row.lot, id: model.newId('scrap'), ...base() };
        const movement = { ...row.movement, id: model.newId('smov'), ...base(), lotId: lot.id, destination: /** @type {'NONE'} */ ('NONE'), sequence: 1 };
        changes.push({ collection: 'scrapLots', record: lot }, { collection: 'scrapMovements', record: movement });
        audits.push(audit('scrapLots', lot.id, 'CREATE', null, lot), audit('scrapMovements', movement.id, 'CREATE', null, movement));
      }
      if (errors.length) return fail(errors);
      const history = operations.scrapHistoryErrors(withChanges(changes));
      if (history.length) return fail(history);
      const err = await commit(changes, audits);
      return err || ok({ count: parsed.rows.length, totalKg: parsed.rows.reduce((sum, row) => sum + row.movement.massKg, 0) });
    }
    /** @param {any} input @returns {Promise<ServiceResult<ScrapMovementRecord>>} */
    async function registerScrapMovement(input) {
      const lot = ds.scrapLots.find((l) => l.id === input.lotId);
      const errors = [...tsIssues(input.ts, 'ts'), ...required(input, ['reason'])];
      if (!lot) errors.push(issue('lotId', 'NOT_FOUND'));
      if (!['OPENING', 'IN', 'OUT', 'ADJUST'].includes(input.kind)) errors.push(issue('kind', 'INVALID_VALUE'));
      if (!isFiniteNumber(input.massKg) || (input.kind === 'ADJUST' ? input.massKg === 0 : input.kind === 'OPENING' ? input.massKg < 0 : input.massKg <= 0)) errors.push(issue('massKg', 'INVALID_VALUE'));
      const destination = input.destination || 'NONE';
      if (input.kind === 'OUT' ? !['REUSE', 'SALE', 'DISPOSAL'].includes(destination) : destination !== 'NONE') errors.push(issue('destination', 'INVALID_VALUE'));
      if (lot && lot.status === 'BLOCKED' && destination === 'REUSE') errors.push(issue('lotId', 'SCRAP_BLOCKED'));
      if (errors.length) return fail(errors);
      /** @type {ScrapMovementRecord} */
      const record = { id: model.newId('smov'), ...base(), lotId: input.lotId, ts: input.ts, kind: input.kind, massKg: input.massKg, destination, reason: text(input.reason),
        sequence: Math.max(0, ...ds.scrapMovements.filter((m) => m.lotId === input.lotId).map((m) => m.sequence || 0)) + 1 };
      const historyErrors = operations.scrapHistoryErrors(withChanges([{ collection: 'scrapMovements', record }]));
      if (historyErrors.length) return fail(historyErrors);
      return create('scrapMovements', record, [], []);
    }
    /** @param {any} input @returns {Issue[]} */
    function fmeaIssues(input) {
      const errors = [...lineIssues(input, true), ...required(input, ['equipment', 'failureMode', 'effect', 'cause', 'controls', 'action', 'responsible', 'dueDate'])];

   *          lines?: {name: string, value: number, kind: 'low' | 'high' | 'cap'}[], formatKg: (v: number) => string,
   *          formatTime: (t: number) => string, labels: {reception: string, measurement: string}, unavailable: string}} opts
