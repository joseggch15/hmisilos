  function massTrend(el, opts) {
    if (!available()) return fallback(el, opts.unavailable);
    const b = base();
    const chart = w.echarts.init(el, null, { renderer: 'svg' });
    instances.push(chart);
    const lineColor = { low: token('--warn'), high: token('--warn'), cap: b.muted };
    /** @type {any[]} */ const series = [];
    opts.series.forEach((s, i) => {
      series.push({
        name: s.name, type: 'line', data: s.points, showSymbol: false, smooth: false, lineStyle: { width: 2, color: s.color }, itemStyle: { color: s.color },
        areaStyle: opts.series.length === 1 ? { color: s.color, opacity: 0.12 } : undefined,
        markLine: i === 0 && opts.lines && opts.lines.length ? {
          silent: true, symbol: 'none', label: { color: b.muted, fontSize: 10, position: 'insideEndTop', formatter: (/** @type {any} */ p) => p.name },
          data: opts.lines.map((l) => ({ name: l.name, yAxis: l.value, lineStyle: { color: lineColor[l.kind], type: 'dashed', width: 1 } })),
        } : undefined,
      });
      if (s.receptions && s.receptions.length) {
        series.push({ name: `${s.name} · ${opts.labels.reception}`, type: 'scatter', data: s.receptions, symbol: 'triangle', symbolSize: 9, itemStyle: { color: token('--info') }, z: 5 });
      }
      if (s.measurements && s.measurements.length) {
        series.push({ name: `${s.name} · ${opts.labels.measurement}`, type: 'scatter', data: s.measurements, symbol: 'diamond', symbolSize: 9, itemStyle: { color: b.ink }, z: 5 });
      }
    });
    chart.setOption({
      animation: false,
      textStyle: b.textStyle,
      grid: b.grid,
      legend: { top: 4, textStyle: { color: b.ink, fontSize: 12 }, type: 'scroll' },
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'line' }, backgroundColor: token('--surface'), borderColor: token('--line'), textStyle: { color: b.ink },
        formatter: (/** @type {any[]} */ items) => {
          if (!items.length) return '';
          const head = opts.formatTime(items[0].value[0]);
          return [head, ...items.map((it) => `${it.marker}${it.seriesName}: <b>${opts.formatKg(it.value[1])}</b>`)].join('<br>');
        },
      },
      xAxis: { type: 'time', ...b.axisCommon, splitLine: { show: false }, axisLabel: { ...b.axisCommon.axisLabel, formatter: (/** @type {number} */ v) => opts.formatTime(v).slice(0, 5) } },
      yAxis: { type: 'value', min: 0, ...b.axisCommon, axisLabel: { ...b.axisCommon.axisLabel, formatter: (/** @type {number} */ v) => opts.formatKg(v) } },
      dataZoom: [{ type: 'inside' }, { type: 'slider', height: 18, bottom: 8, borderColor: b.line, textStyle: { color: b.muted }, labelFormatter: (/** @type {number} */ v) => opts.formatTime(v).slice(0, 5) }],
      series,
    });
    return chart;
  }

  /**
   * Recepciones y consumo por día (barras agrupadas).
   * @param {HTMLElement} el
   * @param {{days: {date: string, receivedKg: number, consumedKg: number}[], labels: {received: string, consumed: string},
   *          formatKg: (v: number) => string, formatDate: (d: string) => string, unavailable: string}} opts
   */
  function dailyBars(el, opts) {
    if (!available()) return fallback(el, opts.unavailable);
    const b = base();
    const chart = w.echarts.init(el, null, { renderer: 'svg' });
    instances.push(chart);
    chart.setOption({
      animation: false,
      textStyle: b.textStyle,
      grid: { ...b.grid, bottom: 36 },
      legend: { top: 4, textStyle: { color: b.ink, fontSize: 12 } },
      tooltip: {
        trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: token('--surface'), borderColor: token('--line'), textStyle: { color: b.ink },
        formatter: (/** @type {any[]} */ items) => [opts.formatDate(items[0].axisValue), ...items.map((it) => `${it.marker}${it.seriesName}: <b>${opts.formatKg(it.value)}</b>`)].join('<br>'),
      },
      xAxis: { type: 'category', data: opts.days.map((d) => d.date), ...b.axisCommon, splitLine: { show: false }, axisLabel: { ...b.axisCommon.axisLabel, formatter: (/** @type {string} */ v) => opts.formatDate(v) } },
      yAxis: { type: 'value', ...b.axisCommon, axisLabel: { ...b.axisCommon.axisLabel, formatter: (/** @type {number} */ v) => opts.formatKg(v) } },
      series: [
        { name: opts.labels.received, type: 'bar', data: opts.days.map((d) => Math.round(d.receivedKg)), itemStyle: { color: token('--info') }, barMaxWidth: 14 },
        { name: opts.labels.consumed, type: 'bar', data: opts.days.map((d) => Math.round(d.consumedKg)), itemStyle: { color: token('--accent') }, barMaxWidth: 14 },
      ],
    });
    return chart;
  }

  return Object.freeze({ available, disposeAll, resizeAll, massTrend, dailyBars });
});

          <dt>${t('f.material')}</dt><dd>${m ? esc(m.name) : '—'}</dd>
          <dt>${t('det.density')}</dt><dd>${props ? `${qty(props.bulkDensityKgM3, 0, 'kg/m³')} / ${qty(props.realDensityGcm3, 3, 'g/cm³')} · ${t(`src.${props.source}`)}` : '—'}</dd>
          <dt>${t('det.valveCfg')}</dt><dd>${valve ? esc(valve.tag) : ''} · ${cfg ? (cfg.mode === 'VOLUMETRIC' ? t('f.modeVol') : t('f.modeDirect')) : '—'}${cfg && cfg.vRevM3 ? ` · ${fmt.num(cfg.vRevM3 * 1000, 2)} L/rev · η ${fmt.num(cfg.eta, 2)}` : ''}</dd>
          <dt>${t('det.alarms')}</dt><dd class="num">L ${fmt.num(v.silo.alarmLowPct, 0)} % · H ${fmt.num(v.silo.alarmHighPct, 0)} %</dd>
        </dl></div>
        <div class="panel"><h3>${t('al.title')}</h3>${alertsList.length ? `<div class="table-wrap"><table><tbody>${alertsList.map((a) => `<tr><td>${sevLabel(a.severity)}</td><td>${esc(t(`rule.${a.rule}`, /** @type {any} */ (a.data)))}</td><td class="num">${fmt.dateTime(a.tStart)}</td><td>${a.active ? (a.acknowledged ? t('al.acked') : `<b>${t('al.active')}</b>`) : t('al.cleared')}</td></tr>`).join('')}</tbody></table></div>` : `<p class="muted">${t('al.none')}</p>`}</div>
      </div>
      <div class="panel"><h3>${t('det.events')}</h3>${eventsTable(ctx, events)}</div>`;
    return {
      html,
      /** @param {HTMLElement} root */
      mount(root) {
        const f = chartFormatters();
        const trend = /** @type {HTMLElement | null} */ (root.querySelector('#chart-trend'));
        if (trend) {
          /** @type {{name: string, value: number, kind: 'low' | 'high' | 'cap'}[]} */
          const lines = s.capacityKg ? [
            { name: `${t('hist.highAlarm')} ${v.silo.alarmHighPct} %`, value: (s.capacityKg * v.silo.alarmHighPct) / 100, kind: 'high' },
            { name: `${t('hist.lowAlarm')} ${v.silo.alarmLowPct} %`, value: (s.capacityKg * v.silo.alarmLowPct) / 100, kind: 'low' },
            { name: t('hist.capacity'), value: s.capacityKg, kind: 'cap' },
          ] : [];
          charts.massTrend(trend, { ...f, series: [trendSeries(ctx, v)], lines, labels: { reception: t('hist.receptionMark'), measurement: t('hist.adjustMark') } });
        }
        const daily = /** @type {HTMLElement | null} */ (root.querySelector('#chart-daily'));
        if (daily) charts.dailyBars(daily, { ...f, days: ctx.app.daily(v.silo.id, { days: 14, at: ctx.now }), labels: { received: t('hist.received'), consumed: t('hist.consumed') } });
      },
    };
  }

  /** Línea de tiempo con acción de anular. @param {Ctx} ctx @param {{kind: string, ts: number, record: any}[]} events */
  function eventsTable(ctx, events) {
    if (!events.length) return `<p class="muted">${t('rec.empty')}</p>`;
    const collection = { RECEPTION: 'receptions', ADJUSTMENT: 'adjustments', ASSIGNMENT: 'assignments', PERIOD: 'valvePeriods', TOTALIZER: 'totalizerReadings' };
    const rows = events.map((e) => {
      const r = e.record;
      let detail = '';
      if (e.kind === 'RECEPTION') detail = `${qty(r.massKg)} · ${esc(r.lot || '—')} · ${esc(r.supplier || '')} ${r.deliveryNote ? `· ${esc(r.deliveryNote)}` : ''}${r.forced ? ` · <span class="tag warn">${t('col.forced')}</span>` : ''}`;
      if (e.kind === 'ADJUSTMENT') detail = `${t(`adj.${r.type}`)} · ${qty(r.measuredMassKg)}${r.estimatedKgAtEntry != null ? ` (${fmt.signed(r.measuredMassKg - r.estimatedKgAtEntry)} kg)` : ''} · ${esc(r.reason)}`;
      if (e.kind === 'ASSIGNMENT') detail = r.materialId ? esc((material(ctx, r.materialId) || { name: r.materialId }).name) : t('f.noMaterialOpt');
      if (e.kind === 'PERIOD') detail = `${fmt.clock(r.start)} → ${r.end ? fmt.dateTime(r.end) : t('col.open')} · ${r.flowKgH != null ? qty(r.flowKgH, 0, 'kg/h') : ''}${r.rpm != null ? ` · ${fmt.num(r.rpm, 1)} RPM` : ''}`;
      if (e.kind === 'TOTALIZER') detail = qty(r.totalKg);
      const voidable = !r.voided;
      return `<tr class="${r.voided ? 'voided' : ''}"><td class="num">${fmt.dateTime(e.ts)}</td><td>${t(`ev.${e.kind}`)}</td><td>${detail}${r.voided ? `<div class="muted keep">${t('col.voided', { reason: esc(r.voidReason || '') })}</div>` : ''}</td>
        <td>${esc(operatorName(ctx, r.operatorId))}</td>
        <td class="r keep">${voidable ? `<button class="btn small ghost" data-action="dlg-void" data-collection="${collection[/** @type {keyof typeof collection} */ (e.kind)]}" data-id="${esc(r.id)}">${t('act.void')}</button>` : ''}</td></tr>`;
    }).join('');
    return `<div class="table-wrap"><table><thead><tr><th>${t('col.ts')}</th><th>${t('col.type')}</th><th>${t('ev.detail')}</th><th>${t('col.operator')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ── Registro ─────────────────────────────────────────────────────────────────
  /** @param {Ctx} ctx */
  function recordsPage(ctx) {
    const ds = ctx.app.dataset;
    const tab = ctx.ui.regTab;
    const siloFilter = ctx.ui.regSilo;
    const valveIds = siloFilter === 'all' ? null : new Set(ds.valves.filter((/** @type {ValveRecord} */ v) => v.siloId === siloFilter).map((/** @type {ValveRecord} */ v) => v.id));
    const bySilo = (/** @type {{siloId: string}} */ r) => siloFilter === 'all' || r.siloId === siloFilter;
    const byValve = (/** @type {{valveId: string}} */ r) => !valveIds || valveIds.has(r.valveId);
    const siloOfValve = (/** @type {string} */ vid) => { const v = ds.valves.find((/** @type {ValveRecord} */ x) => x.id === vid); return v ? siloName(ctx, v.siloId) : ''; };
    const voidBtn = (/** @type {string} */ col, /** @type {any} */ r) => (r.voided ? '' : `<button class="btn small ghost" data-action="dlg-void" data-collection="${col}" data-id="${esc(r.id)}">${t('act.void')}</button>`);
    const voidedNote = (/** @type {any} */ r) => (r.voided ? `<div class="muted keep">${t('col.voided', { reason: esc(r.voidReason || '') })}</div>` : '');
    /** @type {{head: string[], rows: string[], newAction: string, newLabel: string}} */
    let table;
    if (tab === 'periods') {
      const list = ds.valvePeriods.filter(byValve).sort((/** @type {any} */ a, /** @type {any} */ b) => b.start - a.start);
      table = {
        head: [t('col.silo'), t('col.start'), t('col.end'), `${t('col.duration')}`, `${t('col.flow')}`, t('col.rpm'), t('col.source'), t('col.operator'), ''],
        rows: list.map((/** @type {ValvePeriodRecord} */ p) => `<tr class="${p.voided ? 'voided' : ''}"><td>${esc(siloOfValve(p.valveId))}${voidedNote(p)}</td><td class="num">${fmt.dateTime(p.start)}</td><td class="num">${p.end ? fmt.dateTime(p.end) : `<b>${t('col.open')}</b>`}</td>
          <td class="r num">${p.end ? fmt.hours((p.end - p.start) / 3_600_000) : '—'}</td><td class="r">${p.flowKgH != null ? qty(p.flowKgH, 0, 'kg/h') : '—'}</td><td class="r num">${fmt.num(p.rpm, 1)}</td>
          <td>${t(`src.${p.source}`)}</td><td>${esc(operatorName(ctx, p.operatorId))}</td><td class="r keep">${voidBtn('valvePeriods', p)}</td></tr>`),
        newAction: 'dlg-period', newLabel: `+ ${t('rec.periods')}`,
      };
    } else if (tab === 'adjustments') {
      const list = ds.adjustments.filter(bySilo).sort((/** @type {any} */ a, /** @type {any} */ b) => b.ts - a.ts);
      table = {
        head: [t('col.ts'), t('col.silo'), t('col.type'), t('col.input'), t('col.measured'), t('col.delta'), t('col.reason'), t('col.operator'), ''],
        rows: list.map((/** @type {AdjustmentRecord} */ a) => `<tr class="${a.voided ? 'voided' : ''}"><td class="num">${fmt.dateTime(a.ts)}</td><td>${esc(siloName(ctx, a.siloId))}</td><td>${t(`adj.${a.type}`)}${voidedNote(a)}</td>
          <td>${t(`mode.${a.inputMode}`)}: <span class="num">${fmt.num(a.inputValue, a.inputMode === 'KG' ? 0 : 2)}</span></td><td class="r">${qty(a.measuredMassKg)}</td>
          <td class="r num">${a.estimatedKgAtEntry != null ? `${fmt.signed(a.measuredMassKg - a.estimatedKgAtEntry)} kg` : '—'}</td><td>${esc(a.reason)}</td><td>${esc(operatorName(ctx, a.operatorId))}</td><td class="r keep">${voidBtn('adjustments', a)}</td></tr>`),
        newAction: 'dlg-adjust', newLabel: `+ ${t('act.adjust')}`,
      };
    } else if (tab === 'totalizer') {
      const list = ds.totalizerReadings.filter(byValve).sort((/** @type {any} */ a, /** @type {any} */ b) => b.ts - a.ts);
      table = {
        head: [t('col.ts'), t('col.silo'), t('col.total'), t('col.operator'), ''],
        rows: list.map((/** @type {TotalizerReadingRecord} */ r) => `<tr class="${r.voided ? 'voided' : ''}"><td class="num">${fmt.dateTime(r.ts)}${voidedNote(r)}</td><td>${esc(siloOfValve(r.valveId))}</td><td class="r">${qty(r.totalKg)}</td><td>${esc(operatorName(ctx, r.operatorId))}</td><td class="r keep">${voidBtn('totalizerReadings', r)}</td></tr>`),
        newAction: 'dlg-totalizer', newLabel: `+ ${t('act.totalizer')}`,
      };
    } else if (tab === 'assignments') {
      const list = ds.assignments.filter(bySilo).sort((/** @type {any} */ a, /** @type {any} */ b) => b.ts - a.ts);
      table = {
        head: [t('col.ts'), t('col.silo'), t('col.material'), t('col.reason'), t('col.operator'), ''],
        rows: list.map((/** @type {AssignmentRecord} */ a) => `<tr class="${a.voided ? 'voided' : ''}"><td class="num">${fmt.dateTime(a.ts)}${voidedNote(a)}</td><td>${esc(siloName(ctx, a.siloId))}</td><td>${a.materialId ? esc((material(ctx, a.materialId) || { name: a.materialId }).name) : t('f.noMaterialOpt')}</td><td>${esc(a.reason)}</td><td>${esc(operatorName(ctx, a.operatorId))}</td><td class="r keep">${voidBtn('assignments', a)}</td></tr>`),
        newAction: 'dlg-assign', newLabel: `+ ${t('act.assign')}`,
      };
    } else {
      const list = ds.receptions.filter(bySilo).sort((/** @type {any} */ a, /** @type {any} */ b) => b.ts - a.ts);
      table = {
        head: [t('col.ts'), t('col.silo'), t('col.material'), t('col.mass'), t('col.lot'), t('col.supplier'), t('col.note'), t('col.operator'), ''],
        rows: list.map((/** @type {ReceptionRecord} */ r) => `<tr class="${r.voided ? 'voided' : ''}"><td class="num">${fmt.dateTime(r.ts)}</td><td>${esc(siloName(ctx, r.siloId))}${voidedNote(r)}</td><td>${esc((material(ctx, r.materialId) || { name: r.materialId }).name)}${r.forced ? ` <span class="tag warn">${t('col.forced')}</span>` : ''}</td>
          <td class="r">${qty(r.massKg)}</td><td>${esc(r.lot || '—')}</td><td>${esc(r.supplier || '—')}</td><td>${esc(r.deliveryNote || '—')}</td><td>${esc(operatorName(ctx, r.operatorId))}</td><td class="r keep">${voidBtn('receptions', r)}</td></tr>`),
        newAction: 'dlg-reception', newLabel: `+ ${t('act.reception')}`,
      };
    }
    const tabs = [['receptions', 'rec.receptions'], ['periods', 'rec.periods'], ['adjustments', 'rec.adjustments'], ['totalizer', 'rec.totalizer'], ['assignments', 'rec.assignments']];
    const siloOptions = ds.silos.filter((/** @type {SiloRecord} */ s) => s.active).sort((/** @type {SiloRecord} */ a, /** @type {SiloRecord} */ b) => a.order - b.order)
      .map((/** @type {SiloRecord} */ s) => `<option value="${esc(s.id)}"${siloFilter === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
    const siloArg = siloFilter === 'all' ? '' : ` data-silo="${esc(siloFilter)}"`;
    return {
      html: `<div class="toolbar"><h2>${t('nav.records')}</h2><span class="spacer"></span>
        <select id="reg-silo" class="op-select" data-change="regSilo" aria-label="${t('col.silo')}"><option value="all">${t('rec.allSilos')}</option>${siloOptions}</select>
        <button class="btn primary" data-action="${table.newAction}"${siloArg}>${table.newLabel}</button></div>
        <div class="subtabs" role="tablist">${tabs.map(([id, key]) => `<button role="tab" aria-selected="${tab === id}" data-action="regTab" data-tab="${id}">${t(key)}</button>`).join('')}</div>
        ${table.rows.length ? `<div class="table-wrap"><table><thead><tr>${table.head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${table.rows.join('')}</tbody></table></div>` : `<p class="empty-state">${t('rec.empty')}</p>`}`,
    };
  }

  // ── Historial ────────────────────────────────────────────────────────────────
  /** @param {Ctx} ctx */
  function historyPage(ctx) {
    const days = ctx.ui.histDays;
    const configured = ctx.views.filter((v) => v.sim.state.materialId || v.sim.points.length > 1);
    const sel = ctx.ui.histSilo;
    const chosen = sel === 'all' ? configured : configured.filter((v) => v.silo.id === sel);
    const from = ctx.now - days * DAY;
    /** @type {Map<string, any>} */ const byDate = new Map();
    for (const v of chosen) {
      for (const d of reports.dailyTotals(v.sim, { timeZone: ctx.app.timeZone(), from, to: ctx.now })) {
        const acc = byDate.get(d.date) || { date: d.date, openingKg: 0, receivedKg: 0, consumedKg: 0, adjustmentKg: 0, closingKg: 0, runningHours: 0 };
        for (const k of ['openingKg', 'receivedKg', 'consumedKg', 'adjustmentKg', 'closingKg', 'runningHours']) acc[k] += d[/** @type {keyof typeof d} */ (k)];
        byDate.set(d.date, acc);
      }
    }
    const daily = [...byDate.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
    const options = configured.map((v) => `<option value="${esc(v.silo.id)}"${sel === v.silo.id ? ' selected' : ''}>${esc(v.silo.name)}</option>`).join('');
    const rows = daily.slice().reverse().map((d) => `<tr><td class="num">${d.date.slice(8, 10)}/${d.date.slice(5, 7)}/${d.date.slice(0, 4)}</td><td class="r">${qty(d.openingKg)}</td><td class="r">${qty(d.receivedKg)}</td><td class="r">${qty(d.consumedKg)}</td><td class="r num">${fmt.signed(d.adjustmentKg)}</td><td class="r">${qty(d.closingKg)}</td><td class="r num">${fmt.num(d.runningHours / Math.max(1, chosen.length), 1)}</td></tr>`).join('');
    return {
      html: `<div class="toolbar"><h2>${t('nav.history')}</h2><span class="spacer"></span>
        <select id="hist-silo" class="op-select" data-change="histSilo"><option value="all">${t('rec.allSilos')}</option>${options}</select>
        <div class="seg" role="group">${[7, 14, 30].map((n) => `<button type="button" data-action="histDays" data-days="${n}" aria-pressed="${days === n}">${n} d</button>`).join('')}</div></div>
        <div class="panel"><h3>${t('hist.mass')} · ${t('hist.days', { n: days })}</h3><div class="chart" id="chart-mass"></div></div>
        <div class="panel"><h3>${t('hist.daily')}</h3><div class="chart short" id="chart-daily"></div></div>
        <div class="panel"><h3>${t('hist.table')}</h3><div class="table-wrap"><table><thead><tr><th>${t('hist.date')}</th><th class="r">${t('hist.opening')}</th><th class="r">${t('hist.received')}</th><th class="r">${t('hist.consumed')}</th><th class="r">${t('hist.adjusted')} (kg)</th><th class="r">${t('hist.closing')}</th><th class="r">${t('hist.hours')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`,
      /** @param {HTMLElement} root */
      mount(root) {
        const f = chartFormatters();
        const mass = /** @type {HTMLElement | null} */ (root.querySelector('#chart-mass'));
        if (mass) {
          const series = chosen.map((v) => {
            const s = trendSeries({ ...ctx, now: ctx.now }, v);
            const cut = s.points.filter((p) => p[0] >= from);
            return { ...s, points: cut, receptions: s.receptions.filter((p) => p[0] >= from), measurements: s.measurements.filter((p) => p[0] >= from) };
          });
          charts.massTrend(mass, { ...f, series, labels: { reception: t('hist.receptionMark'), measurement: t('hist.adjustMark') } });
        }
        const bars = /** @type {HTMLElement | null} */ (root.querySelector('#chart-daily'));
        if (bars) charts.dailyBars(bars, { ...f, days: daily, labels: { received: t('hist.received'), consumed: t('hist.consumed') } });
      },
    };
  }

  // ── Alertas ──────────────────────────────────────────────────────────────────
  /** @param {Ctx} ctx */
  function alertsPage(ctx) {
    const all = ctx.app.alerts(ctx.now);
    const list = ctx.ui.alertsActiveOnly ? all.filter((/** @type {any} */ a) => a.active) : all.slice(0, 300);
    const rows = list.map((/** @type {any} */ a) => `<tr><td>${sevLabel(a.severity)}</td><td><a href="#${esc(a.siloId)}">${esc(a.siloName)}</a></td><td>${esc(t(`rule.${a.rule}`, a.data))}</td>
      <td class="num">${fmt.dateTime(a.tStart)}</td><td class="num">${a.active ? '—' : fmt.dateTime(a.tEnd)}</td>
      <td>${a.active ? (a.acknowledged ? t('al.acked') : `<b>${t('al.active')}</b>`) : t('al.cleared')}</td>
      <td class="r">${a.acknowledged ? '' : `<button class="btn small" data-action="ack" data-id="${esc(a.id)}">${t('act.ack')}</button>`}</td></tr>`).join('');
    return {
      html: `<div class="toolbar"><h2>${t('al.title')}</h2><span class="spacer"></span>
        <label class="check"><input type="checkbox" id="alerts-active" data-change="alertsActiveOnly"${ctx.ui.alertsActiveOnly ? ' checked' : ''}> ${t('al.onlyActive')}</label></div>
        ${list.length ? `<div class="table-wrap"><table><thead><tr><th>${t('col.type')}</th><th>${t('col.silo')}</th><th>${t('al.title')}</th><th>${t('al.since')}</th><th>${t('al.until')}</th><th>${t('al.state')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="empty-state">${t('al.none')}</p>`}`,
    };
  }

  // ── Catálogos ────────────────────────────────────────────────────────────────
  /** @param {Ctx} ctx */
  function catalogsPage(ctx) {
    const ds = ctx.app.dataset;
    const siloRows = ds.silos.slice().sort((/** @type {SiloRecord} */ a, /** @type {SiloRecord} */ b) => a.order - b.order).map((/** @type {SiloRecord} */ s) => {
      const v = ctx.views.find((x) => x.silo.id === s.id);
      let vol = '—';
      try { vol = fmt.num(geometry.createGeometry(s.geometry).totalVolumeM3, 2); } catch { /* geometría inválida */ }
      const gs = /** @type {any} */ (s.geometry);
      const m = v ? material(ctx, v.sim.state.materialId) : null;
      return `<tr><td><b>${esc(s.name)}</b>${s.active ? '' : ` <span class="tag">${t('cat.inactive')}</span>`}</td><td class="num">Ø ${fmt.num(gs.radiusM * 2, 2)} × ${fmt.num(gs.heightM, 2)} m${gs.type === 'CYLINDER_CONE' ? ` + ${fmt.num(gs.coneHeightM, 2)} m` : ''}${s.geometryEstimated ? ` <span class="tag">${t('silo.estimatedDims')}</span>` : ''}</td>
        <td class="r num">${vol} m³</td><td>${m ? esc(m.name) : '—'}</td><td class="r">${v && v.sim.state.capacityKg ? qty(v.sim.state.capacityKg) : '—'}</td>
        <td class="num">${fmt.num(s.alarmLowPct, 0)} / ${fmt.num(s.alarmHighPct, 0)} %</td><td class="r"><button class="btn small" data-action="dlg-silo" data-silo="${esc(s.id)}">${t('act.edit')}</button></td></tr>`;
    }).join('');
    const matRows = ctx.app.materials(ctx.now).map((/** @type {any} */ m) => `<tr><td><span class="swatch" style="background:${esc(m.color)}"></span> <b>${esc(m.name)}</b>${m.active ? '' : ` <span class="tag">${t('cat.inactive')}</span>`}<div class="hint">${esc([m.code, m.family, m.aliases].filter(Boolean).join(' · '))}</div></td>
      <td class="r">${m.props ? qty(m.props.realDensityGcm3, 3, 'g/cm³') : '—'}</td><td class="r">${m.props ? qty(m.props.bulkDensityKgM3, 0, 'kg/m³') : '—'}</td>
      <td>${m.props ? `<span class="tag${m.props.source === 'PROVISIONAL' ? ' warn' : ''}">${t(`src.${m.props.source}`)}</span>` : `<span class="tag warn">${t('cat.densityPending')}</span>`}</td><td>${esc(m.supplier || '—')}</td>
      <td class="r"><button class="btn small" data-action="dlg-props" data-id="${esc(m.id)}">${t('cat.newProps')}</button> <button class="btn small" data-action="dlg-material" data-id="${esc(m.id)}">${t('act.edit')}</button></td></tr>`).join('');
    const opRows = ds.operators.map((/** @type {OperatorRecord} */ o) => `<tr><td><b>${esc(o.name)}</b></td><td>${t(`role.${o.role}`)}</td><td>${o.active ? t('cat.active') : t('cat.inactive')}</td>
      <td class="r"><button class="btn small" data-action="op-toggle" data-id="${esc(o.id)}">${o.active ? t('cat.deactivate') : t('cat.activate')}</button></td></tr>`).join('');
    return {
      html: `<div class="toolbar"><h2>${t('nav.catalogs')}</h2></div>
        <div class="panel"><div class="toolbar"><h3>${t('cat.silos')}</h3><span class="spacer"></span><button class="btn primary" data-action="dlg-new-silo">+ ${t('cat.addSilo')}</button></div>
          <div class="table-wrap"><table><thead><tr><th>${t('f.name')}</th><th>${t('cat.geometry')}</th><th class="r">${t('f.totalVolume')}</th><th>${t('f.material')}</th><th class="r">${t('silo.capacity')}</th><th>${t('det.alarms')}</th><th></th></tr></thead><tbody>${siloRows}</tbody></table></div></div>
        <div class="panel"><div class="toolbar"><h3>${t('cat.materials')}</h3><span class="spacer"></span><button class="btn primary" data-action="dlg-material">+ ${t('cat.addMaterial')}</button></div>

  // ── Datos ────────────────────────────────────────────────────────────────────
  /** @param {Ctx} ctx @param {{storageLabel: string}} info */
  function dataPage(ctx, info) {

          <div class="panel"><h3>${t('data.seed')}</h3><p>${t('data.seedHelp')}</p><button class="btn" data-action="dlg-reset" data-kind="seed">${t('data.load')}</button></div>

  // ── Configuración ────────────────────────────────────────────────────────────
  /** @param {Ctx} ctx @param {{version: string, buildDate: string, selftest: SelfTestResult[]}} info */
  function settingsPage(ctx, info) {
    const s = (/** @type {string} */ k) => ctx.app.setting(k);
    const zones = ['America/Bogota', 'America/Mexico_City', 'America/Lima', 'America/Santiago', 'America/Sao_Paulo', 'America/New_York', 'Europe/Rome', 'Europe/Madrid', 'Asia/Dubai', 'UTC'];
    const passCount = info.selftest.filter((r) => r.pass).length;
    const shown = (/** @type {SelfTestResult} */ r, /** @type {'expected' | 'actual'} */ k) => {
      const v = r[k];
      return typeof v === 'number' ? `${fmt.num(v, r.decimals == null ? 0 : r.decimals)} ${esc(r.unit)}` : esc(String(v));
    };
    const field = (/** @type {string} */ id, /** @type {string} */ label, /** @type {unknown} */ value, /** @type {string} */ extra = '') => `<div class="field"><label for="set-${id}">${label}</label><input id="set-${id}" name="${id}" inputmode="decimal" value="${esc(fmt.plain(Number(value), 2))}"${extra}><span class="err" data-err="${id}"></span></div>`;
    return {
      html: `<div class="toolbar"><h2>${t('nav.settings')}</h2></div>
        <form class="panel" id="settings-form" data-submit="settings">
          <h3>${t('set.general')}</h3>
          <div class="fields">
            <div class="field"><label for="set-language">${t('set.language')}</label><select id="set-language" name="language"><option value="es"${s('language') === 'es' ? ' selected' : ''}>Español</option><option value="en"${s('language') === 'en' ? ' selected' : ''}>English</option></select></div>
            <div class="field"><label for="set-numberFormat">${t('set.numberFormat')}</label><select id="set-numberFormat" name="numberFormat"><option value="en"${s('numberFormat') === 'en' ? ' selected' : ''}>1,234.56</option><option value="es"${s('numberFormat') === 'es' ? ' selected' : ''}>1.234,56</option></select></div>
            <div class="field"><label for="set-timeZone">${t('set.timeZone')}</label><input id="set-timeZone" name="timeZone" list="tz-list" value="${esc(ctx.app.timeZone())}"><datalist id="tz-list">${zones.map((z) => `<option value="${z}"></option>`).join('')}</datalist><span class="err" data-err="timeZone"></span></div>
          </div>
          <h3 style="margin-top:16px">${t('set.alarms')}</h3>
          <div class="fields">
            ${field('alarmLowPct', t('f.alarmLow'), s('alarmLowPct'))}
            ${field('alarmHighPct', t('f.alarmHigh'), s('alarmHighPct'))}
            ${field('semaphoreRedHours', t('set.redHours'), s('semaphoreRedHours'))}
            ${field('semaphoreYellowHours', t('set.yellowHours'), s('semaphoreYellowHours'))}
            ${field('leadTimeDays', t('set.leadTime'), s('leadTimeDays'))}
            ${field('staleEstimateDays', t('set.stale'), s('staleEstimateDays'))}
          </div>
          <div class="toolbar" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" type="submit">${t('act.save')}</button></div>
        </form>
        <div class="panel"><div class="toolbar"><h3>${t('set.selftest')}</h3><span class="light light-${passCount === info.selftest.length ? 'GREEN' : 'RED'}"><span class="glyph">${passCount === info.selftest.length ? GLYPH.GREEN : GLYPH.RED}</span>${passCount}/${info.selftest.length} PASS</span></div>
          <p class="muted">${t('set.selftestHelp')}</p>
          <div class="table-wrap selftest"><table><thead><tr><th>ID</th><th>${t('set.check')}</th><th class="r">${t('set.expected')}</th><th class="r">${t('set.actual')}</th><th>${t('set.result')}</th></tr></thead><tbody>
          ${info.selftest.map((r) => `<tr><td class="num">${esc(r.id)}</td><td>${esc(i18n.getLang() === 'en' ? r.en : r.es)}</td><td class="r num">${shown(r, 'expected')}</td><td class="r num">${shown(r, 'actual')}</td><td class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</td></tr>`).join('')}
          </tbody></table></div></div>
        <div class="panel about"><h3>${t('set.about')}</h3><p>hmiSilos ${esc(info.version)} · build ${esc(info.buildDate)} · schema ${model.COLLECTIONS.length} · ${esc(ctx.app.repositoryKind)}</p></div>`,
    };
  }

  return Object.freeze({
    lightPill, sevLabel, brandHtml, navHtml, bandHtml, siloCard,
    plantPage, detailPage, recordsPage, historyPage, alertsPage, catalogsPage, dataPage, settingsPage,
  });
});

/* ── src/ui/dialogs.js ── */
/**
 * hmiSilos · ui/dialogs
 * Formularios de la app. Cada definición aporta: título, cuerpo (HTML), vista previa en vivo
 * opcional y `submit(values)` que llama a la capa de servicios y devuelve su ServiceResult.
 * Los nombres de campo coinciden con el `field` de los Issue para mostrar el error en su lugar.
 */
(function (root, factory) {
  const g = /** @type {any} */ (root).HS;
  const mod = factory(g.i18n, g.fmt, g.geometry, g.balance, g.model, g.app);
  (root.HS = root.HS || {}).dialogs = mod;
})(globalThis, /**
   * @param {typeof import('./i18n.js')} i18n @param {typeof import('./format.js')} fmt @param {typeof import('../core/geometry.js')} geometry
   * @param {typeof import('../core/balance.js')} balance @param {typeof import('../domain/model.js')} model @param {typeof import('../services/app.js')} appModule
   */
  function (i18n, fmt, geometry, balance, model, appModule) {
  'use strict';

  const { t } = i18n;
  const esc = fmt.esc;

  // ── Campos ───────────────────────────────────────────────────────────────────
  /**
   * @param {string} name @param {string} label @param {{type?: string, value?: unknown, hint?: string, wide?: boolean, attrs?: string}} [o]
   */
  function input(name, label, o = {}) {
    const type = o.type || 'text';
    const numeric = type === 'number';
    return `<div class="field${o.wide ? ' wide' : ''}"><label for="f-${name}">${label}</label>
      <input id="f-${name}" name="${name}" type="${numeric ? 'text' : type}"${numeric ? ' inputmode="decimal"' : ''} value="${esc(o.value == null ? '' : o.value)}" ${o.attrs || ''}>
      ${o.hint ? `<span class="hint">${o.hint}</span>` : ''}<span class="err" data-err="${name}"></span></div>`;
  }
  /** @param {string} name @param {string} label @param {[string, string][]} options @param {string | null | undefined} value @param {{wide?: boolean}} [o] */
  function select(name, label, options, value, o = {}) {
    return `<div class="field${o.wide ? ' wide' : ''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">
      ${options.map(([v, l]) => `<option value="${esc(v)}"${v === value ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select><span class="err" data-err="${name}"></span></div>`;
  }
  /** @param {string} name @param {string} label @param {number} ts */
  const datetime = (name, label, ts) => input(name, label, { type: 'datetime-local', value: fmt.toLocalInput(ts) });
  /** @param {string} name @param {string} label @param {[string, string][]} options @param {string} value */
  function radios(name, label, options, value) {
    return `<div class="field wide"><span class="eyebrow">${label}</span><div class="radio-row" role="radiogroup">
      ${options.map(([v, l]) => `<label><input type="radio" name="${name}" value="${esc(v)}"${v === value ? ' checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div><span class="err" data-err="${name}"></span></div>`;
  }
  /** @param {string} name @param {string} label @param {boolean} checked */
  const checkbox = (name, label, checked) => `<label class="check field wide"><input type="checkbox" name="${name}"${checked ? ' checked' : ''}> ${label}</label>`;
  /** @param {Record<string, unknown>} rows */
  const preview = (rows) => `<dl class="preview">${Object.entries(rows).map(([k, v]) => `<dt>${k}</dt><dd class="num">${v}</dd>`).join('')}</dl>`;
  /** @param {'warn' | 'crit' | 'info'} kind @param {string} text */
  const notice = (kind, text) => `<div class="notice ${kind}">${text}</div>`;

  /** @param {any} app */
  const silosWithMaterial = (app, now = Date.now()) => app.plantView(now).filter((/** @type {SiloViewModel} */ v) => v.sim.state.materialId);
  /** @param {any} app */
  const siloOptions = (app, onlyConfigured = true) => (onlyConfigured ? silosWithMaterial(app).map((/** @type {SiloViewModel} */ v) => v.silo) : app.dataset.silos.filter((/** @type {SiloRecord} */ s) => s.active))
    .sort((/** @type {SiloRecord} */ a, /** @type {SiloRecord} */ b) => a.order - b.order).map((/** @type {SiloRecord} */ s) => /** @type {[string, string]} */ ([s.id, s.name]));
  /** @param {any} app */
  const materialOptions = (app) => app.dataset.materials.filter((/** @type {MaterialRecord} */ m) => m.active).map((/** @type {MaterialRecord} */ m) => /** @type {[string, string]} */ ([m.id, m.name]));
  /** @param {unknown} v */
  const n = (v) => fmt.parseNumber(v);
  /** @param {unknown} v */
  const optionalNumber = (v) => (v == null || String(v).trim() === '' ? null : fmt.parseNumber(v));
  /** @param {unknown} v @param {number} fallback */
  const tsOf = (v, fallback) => (v ? fmt.fromLocalInput(String(v)) : fallback);

  /** Último periodo de la rotativa del silo (para precargar flujo y RPM). @param {any} app @param {string} siloId */
  function lastPeriod(app, siloId) {
    const valve = app.dataset.valves.find((/** @type {ValveRecord} */ v) => v.siloId === siloId);
    if (!valve) return null;
    return app.dataset.valvePeriods.filter((/** @type {ValvePeriodRecord} */ p) => p.valveId === valve.id && !p.voided)
      .sort((/** @type {ValvePeriodRecord} */ a, /** @type {ValvePeriodRecord} */ b) => b.start - a.start)[0] || null;
  }

  /**
   * @typedef {Object} DialogDef
   * @property {(p: any) => string} title
   * @property {(ctx: any, p: any) => string} body
   * @property {(values: any, ctx: any, p: any) => {html: string, forced?: boolean}} [preview]
   * @property {(values: any) => Record<string, boolean>} [visible]  campos visibles según los valores
   * @property {(values: any, ctx: any, p: any) => Promise<ServiceResult<any>>} submit
   * @property {string} [submitLabel]
   * @property {string} [success]
   * @property {boolean} [danger]
   */

  /** @type {Record<string, DialogDef>} */
  const DEFS = {
    reception: {
      title: () => t('dlg.reception'),
      body(ctx, p) {
        const silos = siloOptions(ctx.app);
        const siloId = p.siloId || (silos[0] && silos[0][0]);
        const state = siloId ? ctx.app.stateAt(siloId, ctx.now) : null;
        const mat = state && state.materialId ? ctx.app.dataset.materials.find((/** @type {MaterialRecord} */ m) => m.id === state.materialId) : null;
        return `<div class="fields">${select('siloId', t('f.silo'), silos, siloId)}${select('materialId', t('f.material'), materialOptions(ctx.app), state ? state.materialId : null)}
          ${input('massKg', t('f.massKg'), { type: 'number', attrs: 'autofocus' })}${datetime('ts', t('f.ts'), ctx.now)}
          ${input('lot', t('f.lot'))}${input('supplier', t('f.supplier'), { value: mat ? mat.supplier : '' })}${input('deliveryNote', t('f.deliveryNote'))}</div>
          <div id="forced-box" hidden class="fields">${checkbox('forced', t('f.forced'), false)}${input('forceReason', t('f.forceReason'), { wide: true })}</div>`;
      },
      preview(v, ctx) {
        const c = ctx.app.checkReception({ siloId: v.siloId, materialId: v.materialId, massKg: n(v.massKg), ts: tsOf(v.ts, ctx.now) });
        if (!c.preview) return { html: '' };
        const pv = c.preview;
        const over = c.errors.some((/** @type {Issue} */ e) => e.code === 'OVER_CAPACITY');
        const mismatch = c.errors.find((/** @type {Issue} */ e) => e.code === 'MATERIAL_MISMATCH' || e.code === 'NO_MATERIAL_ASSIGNED');
        return {
          html: preview({
            [t('pv.before')]: `${fmt.num(pv.beforeKg)} kg`,
            [t('pv.available')]: pv.availableKg == null ? '—' : `${fmt.num(pv.availableKg)} kg`,
            [t('pv.after')]: `${fmt.num(pv.afterKg)} kg${pv.afterPct != null ? ` · ${fmt.num(pv.afterPct, 1)} %` : ''}`,
          }) + (over ? notice('warn', i18n.issueText({ code: 'OVER_CAPACITY', params: { availableKg: pv.availableKg } }, (x) => fmt.num(/** @type {number} */ (x)))) : '')
            + (mismatch ? notice('crit', i18n.issueText(mismatch)) : ''),
          forced: over,
        };
      },
      submit: (v, ctx) => ctx.app.registerReception({
        siloId: v.siloId, materialId: v.materialId, massKg: n(v.massKg), ts: tsOf(v.ts, Date.now()), lot: v.lot, supplier: v.supplier,
        deliveryNote: v.deliveryNote, forced: !!v.forced, forceReason: v.forceReason,
      }),
      success: 'saved.reception',
    },
    start: {
      title: () => t('dlg.start'),
      body(ctx, p) {
        const last = lastPeriod(ctx.app, p.siloId);
        return `<p class="muted">${esc((ctx.app.dataset.silos.find((/** @type {SiloRecord} */ s) => s.id === p.siloId) || {}).name || '')} · ${t('f.flowHint')}</p>
          <div class="fields">${input('flowKgH', t('f.flowKgH'), { type: 'number', value: last ? fmt.plain(last.flowKgH, 1) : '', attrs: 'autofocus' })}
          ${input('rpm', t('f.rpm'), { type: 'number', value: last ? fmt.plain(last.rpm, 1) : '' })}
          ${datetime('ts', t('f.ts'), ctx.now)}${input('note', t('f.note'))}</div>`;
      },
      submit: (v, ctx, p) => ctx.app.startValve(p.siloId, { flowKgH: optionalNumber(v.flowKgH), rpm: optionalNumber(v.rpm), ts: tsOf(v.ts, Date.now()), note: v.note }),
      submitLabel: 'act.start',
    },
    change: {
      title: () => t('dlg.change'),
      body(ctx, p) { return DEFS.start.body(ctx, p); },
      submit: (v, ctx, p) => ctx.app.changeValveFlow(p.siloId, { flowKgH: optionalNumber(v.flowKgH), rpm: optionalNumber(v.rpm), ts: tsOf(v.ts, Date.now()), note: v.note }),
    },
    stop: {
      title: () => t('dlg.stop'),
      body: (ctx, p) => `<p>${esc((ctx.app.dataset.silos.find((/** @type {SiloRecord} */ s) => s.id === p.siloId) || {}).name || '')}</p><div class="fields">${datetime('ts', t('f.ts'), ctx.now)}</div>`,
      submit: (v, ctx, p) => ctx.app.stopValve(p.siloId, { ts: tsOf(v.ts, Date.now()) }),
      submitLabel: 'act.stop',
      danger: true,
    },
    period: {
      title: () => t('rec.periods'),
      body: (ctx, p) => `<div class="fields">${select('siloId', t('f.silo'), siloOptions(ctx.app), p.siloId)}${datetime('start', t('col.start'), ctx.now - 3_600_000)}
        ${input('end', t('col.end'), { type: 'datetime-local', hint: t('col.open') })}${input('flowKgH', t('f.flowKgH'), { type: 'number' })}${input('rpm', t('f.rpm'), { type: 'number' })}${input('note', t('f.note'))}</div>`,
      submit: (v, ctx) => ctx.app.registerPeriod(v.siloId, { start: tsOf(v.start, NaN), end: v.end ? fmt.fromLocalInput(v.end) : null, flowKgH: optionalNumber(v.flowKgH), rpm: optionalNumber(v.rpm), note: v.note }),
    },
    adjust: {
      title: () => t('dlg.adjust'),
      body(ctx, p) {
        const silos = siloOptions(ctx.app);
        const types = ['TAPE', 'PROBE', 'EMPTY', 'PRODUCTION_RECON', 'OTHER'].map((x) => /** @type {[string, string]} */ ([x, t(`adj.${x}`)]));
        return `<div class="fields">${select('siloId', t('f.silo'), silos, p.siloId || (silos[0] && silos[0][0]))}${select('type', t('f.adjType'), types, 'TAPE')}
          ${radios('inputMode', t('f.inputMode'), ['ULLAGE_M', 'LEVEL_M', 'KG'].map((x) => /** @type {[string, string]} */ ([x, t(`mode.${x}`)])), 'ULLAGE_M')}
          ${input('inputValue', t('f.inputValue'), { type: 'number', attrs: 'autofocus' })}${datetime('ts', t('f.ts'), ctx.now)}
          ${input('reason', t('f.reason'), { wide: true, value: t('adj.TAPE') })}</div>`;
      },
      preview(v, ctx) {
        const c = ctx.app.checkAdjustment({ siloId: v.siloId, type: v.type, inputMode: v.inputMode, inputValue: v.type === 'EMPTY' ? 0 : n(v.inputValue), ts: tsOf(v.ts, ctx.now), reason: v.reason || 'x' });
        if (!c.preview) {
          const err = c.errors.find((/** @type {Issue} */ e) => e.field === 'inputValue');
          return { html: err && String(v.inputValue || '').trim() ? notice('warn', i18n.issueText(err, (x) => fmt.num(/** @type {number} */ (x), 2))) : '' };
        }
        const pv = c.preview;
        return {
          html: preview({
            [t('pv.estimated')]: `${fmt.num(pv.estimatedKg)} kg`,
            [t('pv.measured')]: `${fmt.num(pv.measuredKg)} kg`,
            [t('pv.delta')]: `${fmt.signed(pv.deltaKg)} kg${pv.deltaPct != null ? ` · ${fmt.signed(pv.deltaPct, 1)} %` : ''}`,
          }),
        };
      },
      visible: (v) => ({ inputMode: v.type !== 'EMPTY', inputValue: v.type !== 'EMPTY' }),
      submit: (v, ctx) => ctx.app.registerAdjustment({
        siloId: v.siloId, type: v.type, inputMode: v.inputMode, inputValue: v.type === 'EMPTY' ? 0 : n(v.inputValue), ts: tsOf(v.ts, Date.now()), reason: v.reason,
      }),
    },
    totalizer: {
      title: () => t('dlg.totalizer'),
      body: (ctx, p) => `<div class="fields">${select('siloId', t('f.silo'), siloOptions(ctx.app), p.siloId)}${input('totalKg', t('f.totalKg'), { type: 'number', attrs: 'autofocus' })}${datetime('ts', t('f.ts'), ctx.now)}${input('note', t('f.note'))}</div>`,
      submit: (v, ctx) => ctx.app.registerTotalizerReading(v.siloId, { totalKg: n(v.totalKg), ts: tsOf(v.ts, Date.now()), note: v.note }),
    },
    assign: {
      title: () => t('dlg.assign'),
      body(ctx, p) {
        const silos = siloOptions(ctx.app, false);
        const siloId = p.siloId || (silos[0] && silos[0][0]);
        const state = siloId ? ctx.app.stateAt(siloId, ctx.now) : null;
        return `<div class="fields">${select('siloId', t('f.silo'), silos, siloId)}${select('materialId', t('f.material'), [['', t('f.noMaterialOpt')], ...materialOptions(ctx.app)], state ? state.materialId || '' : '')}
          ${datetime('ts', t('f.ts'), ctx.now)}${input('reason', t('f.reason'))}</div>`;
      },
      submit: (v, ctx) => ctx.app.assignMaterial(v.siloId, { materialId: v.materialId || null, ts: tsOf(v.ts, Date.now()), reason: v.reason }),
    },
    void: {
      title: () => t('dlg.void'),
      body: () => `${notice('info', t('void.help'))}<div class="fields">${input('reason', t('f.reason'), { wide: true, attrs: 'autofocus' })}</div>`,
      submit: (v, ctx, p) => ctx.app.voidRecord({ collection: p.collection, id: p.id, reason: v.reason }),
      submitLabel: 'act.void', danger: true,
    },
    silo: {
      title: (p) => (p.siloId ? `${t('dlg.silo')}` : t('dlg.newSilo')),
      body(ctx, p) {

  /** @param {string} value */

  }

    const lots = balances.map((r) => `<tr ${rowAttrs([r.lot.code, r.lot.category, name(ds.materials, r.lot.materialId), name(ds.productionLines, r.lot.lineId), r.lot.location, r.lot.recipient, r.lot.presentation, r.lot.status])}><td><b>${text(r.lot.code)}</b><small>${text(r.lot.source)}</small></td><td>${text(r.lot.category)}<small>${text(name(ds.materials, r.lot.materialId))}</small></td><td>${text(name(ds.productionLines, r.lot.lineId))}</td><td>${text(r.lot.location)}</td><td>${text(r.lot.recipient)}<small>${text(r.lot.presentation)}</small></td><td class="r num">${ds.scrapMovements.some((/** @type {any} */ m) => m.lotId === r.lot.id && !m.voided && m.ts <= ctx.now) ? `${num(r.kg)} kg` : L('Pendiente de pesaje', 'Weighing pending')}</td><td>${r.lot.status === 'BLOCKED' ? `<span class="op-warning">${L('Bloqueado', 'Blocked')}</span>` : L('Disponible', 'Available')}</td><td>${button('scrap-lot', L('Editar / liberar', 'Edit / release'), `data-id="${esc(r.lot.id)}"`)}${button('scrap-movement', L('Movimiento', 'Movement'), `data-lot="${esc(r.lot.id)}"`)}</td></tr>`);

      return `<tr ${rowAttrs([lot && lot.code, movementLabel(r.kind), destinationLabel(r.destination), r.reason], r.voided)}><td class="num">${fmt.dateTime(r.ts)}</td><td>${text(lot && lot.code)}</td><td>${text(movementLabel(r.kind))}</td><td class="r num">${fmt.signed(operations.signedMovement(r), 2)} kg</td><td>${text(destinationLabel(r.destination))}</td><td class="op-description">${text(r.reason)}</td><td>${voidButton('scrapMovements', r)}</td></tr>`;

 'Destination'), L('Motivo', 'Reason'), L('Acciones', 'Actions')], rows)}</div>`, mount: mountFilter(ctx) };

E', 'Production windows for OEE')}</h3><span class="spacer"></span>${exportButton('productionRuns')}</div>${table([L('Línea', 'Line'), L('Turno / orden', 'Shift / order'), L('Período', 'Period'), L('Plan / operación', 'Plan / operation'), L('Tasa ideal', 'Ideal rate'), L('Total', 'Total'), L('Conforme', 'Good'), L('Scrap producción', 'Production scrap'), L('Acciones', 'Actions')], runRows)}</section>${references([['Brückner · BOPP', 'https://www.brueckner-maschinenbau.com/en/innovations']])}`, mount: mountFilter(ctx) };

  // Field names are identical to service Issue.field so validation appears beside each input.
  /** @param {string} field @param {string} label @param {{value?: unknown,type?: string,wide?: boolean,hint?:string}} [o] */
  function input(field, label, o = {}) {

            const source = offline.createBufferSource(); source.buffer = decoded; source.connect(offline.destination); source.start();

          } catch (err) { if (token === generation) { error(err); setBusy(false); } }
          finally { if (decoder) await decoder.close(); }

        nextRecorder.onerror = () => { if (token === generation) { cancel(); error(new Error('MIC_FAILED')); } };

        recordTimer = setTimeout(() => { if (token === generation && nextRecorder.state === 'recording') nextRecorder.stop(); }, 20_000);

    };
    message('assistant', t('Consulta: «¿Cuánto queda en el silo 6?», «Inventario total», «Alertas activas» o «Consumo del silo 8 ayer». Activa IA local para interpretar más formas de preguntar.', 'Try: “How much remains in silo 6?”, “Total inventory”, “Active alerts” or “Silo 8 consumption yesterday”. Enable local AI to interpret more ways of asking.'));

/* ── src/ui/main.js ── */
/**
 * hmiSilos · ui/main

(function (root) {
  'use strict';

  const ROUTES = ['planta', 'kpis', 'produccion', 'bitacora', 'scrap', 'amef', 'registro', 'historial', 'alertas', 'catalogos', 'datos', 'config'];

  /** @param {string} sel */

  /** @type {any} */ let app = null;
  /** @type {'local' | 'memory' | 'shared'} */ let storage = 'local';
  /** @type {{kind: string, params: any, def: any} | null} */ let dlgState = null;
  /** @type {SelfTestResult[] | null} */ let selftestCache = null;
  /** @type {any} */ let assistant = null;

  // ── Preferencias del equipo ──────────────────────────────────────────────────
  function applyTheme() {
    const theme = platform.prefs.get('theme');

    else delete document.documentElement.dataset.theme;

  function context() {

    const list = app.plantView(now);

  /** @param {any} c @param {any} summary */
  function renderChrome(c, summary) {

    $('#mode-chip').innerHTML = `${app.isDemo() ? `<span class="chip chip-demo">${t('mode.demo')}</span> ` : ''}<span class="chip"${storage === 'memory' ? ' style="border-color:var(--warn)"' : ''}>${t(modeKey)}</span>`;
    const op = /** @type {HTMLSelectElement} */ ($('#operator'));
    op.setAttribute('aria-label', t('operator.label'));
    op.innerHTML = app.dataset.operators.filter((/** @type {OperatorRecord} */ o) => o.active)
      .map((/** @type {OperatorRecord} */ o) => `<option value="${esc(o.id)}"${o.id === app.operatorId ? ' selected' : ''}>${esc(o.name)}</option>`).join('');
    for (const b of document.querySelectorAll('#lang-switch button')) b.setAttribute('aria-pressed', String(/** @type {HTMLElement} */ (b).dataset.lang === i18n.getLang()));
    const theme = $('#theme-toggle');

    theme.title = t('theme.toggle');

    $('#band').innerHTML = views.bandHtml(c, summary);

  }

  function render() {
    if (!app) return;
    charts.disposeAll();
    const c = context();
    const summary = reports.plantSummary(c.views, app.dataset.materials);
    renderChrome(c, summary);
    if (assistant) assistant.refresh();
    let page;
    switch (ui.route) {
      case 'kpis': case 'produccion': case 'bitacora': case 'scrap': case 'amef': page = HS.operationsUi.page(c, ui.route); break;
      case 'silo': page = views.detailPage(c, ui.siloId); break;
      case 'registro': page = views.recordsPage(c); break;
      case 'historial': page = views.historyPage(c); break;
      case 'alertas': page = views.alertsPage(c); break;
      case 'catalogos': page = views.catalogsPage(c); break;
      case 'datos': page = views.dataPage(c, { storageLabel: t(storage === 'shared' ? 'mode.shared' : storage === 'memory' ? 'mode.memory' : 'mode.local') }); break;
      case 'config':

  }

  function parseHash() {
    const h = decodeURIComponent((root.location.hash || '').replace(/^#/, ''));
    if (app && app.dataset.silos.some((/** @type {SiloRecord} */ s) => s.id === h)) { ui.route = 'silo'; ui.siloId = h; return; }
    ui.route = ROUTES.includes(h) ? h : 'planta';
  }

  // ── Avisos ───────────────────────────────────────────────────────────────────
  /** @param {unknown} x */
  const issueNumber = (x) => {
    const v = /** @type {number} */ (x);
    return Number.isInteger(v) ? fmt.num(v) : fmt.num(v, Math.abs(v) < 100 ? 2 : 0);
  };
  /** @param {Issue} issue */
  const issueText = (issue) => i18n.issueText(issue, issueNumber);

  /** @param {string} message @param {Issue[]} [warnings] @param {'ok' | 'warn' | 'crit'} [kind] */
  function toast(message, warnings = [], kind = 'ok') {
    const box = $('#toasts');
    const el = document.createElement('div');
    const level = kind !== 'ok' ? kind : warnings.length ? 'warn' : 'ok';
    el.className = `toast ${level === 'ok' ? '' : level}`;
    el.innerHTML = `<b>${esc(message)}</b>${warnings.map((w) => `<div>${esc(issueText(w))}</div>`).join('')}`;
    box.appendChild(el);
    setTimeout(() => el.remove(), level === 'ok' ? 4500 : 9000);
  }

  // ── Diálogos ─────────────────────────────────────────────────────────────────
  /** @param {string} kind @param {any} [params] */
  function openDialog(kind, params = {}) {
    const def = dialogs.get(kind) || HS.operationsUi.getDialog(kind) || HS.scrapImportUi.getDialog(kind);
    if (!def) return;
    const c = context();
    dlgState = { kind, params, def };
    const dlg = /** @type {HTMLDialogElement} */ ($('#dialog'));
    dlg.innerHTML = `<form class="dlg" id="dlg-form" novalidate>
      <header><h3>${esc(def.title(params))}</h3><button type="button" class="icon-btn" data-action="dlg-close" aria-label="${t('act.close')}">✕</button></header>
      <div class="body">${def.body(c, params)}<div id="dlg-preview"></div><div id="dlg-general"></div></div>
      <footer><button type="button" class="btn" data-action="dlg-close">${t('act.cancel')}</button>
      <button type="submit" class="btn ${def.danger ? 'danger' : 'primary'}" id="dlg-submit">${t(def.submitLabel || 'act.save')}</button></footer></form>`;
    if (!dlg.open) dlg.showModal();
    refreshDialog();
    const first = /** @type {HTMLElement | null} */ (dlg.querySelector('[autofocus]') || dlg.querySelector('input:not([type=hidden]), select'));
    if (first) first.focus();
    if (def.mount) def.mount(/** @type {HTMLFormElement} */ ($('#dlg-form')), c, params);
  }

  function closeDialog() {
    const dlg = /** @type {HTMLDialogElement} */ ($('#dialog'));
    if (dlg.open) dlg.close();
    dlg.innerHTML = '';
    dlgState = null;
  }

  /** Visibilidad de campos y vista previa en vivo. */
  function refreshDialog() {
    if (!dlgState) return;
    const form = /** @type {HTMLFormElement | null} */ (document.getElementById('dlg-form'));
    if (!form) return;
    const values = dialogs.readForm(form);
    if (dlgState.def.visible) {
      const vis = dlgState.def.visible(values);
      for (const [name, show] of Object.entries(vis)) {
        const ctl = form.querySelector(`[name="${name}"]`);
        const field = ctl && ctl.closest('.field');
        if (field) /** @type {HTMLElement} */ (field).hidden = !show;
      }
    }
    if (dlgState.def.preview) {
      try {
        const p = dlgState.def.preview(values, context(), dlgState.params);
        $('#dlg-preview').innerHTML = p.html || '';
        const forced = document.getElementById('forced-box');
        if (forced) forced.hidden = !p.forced;
      } catch (err) { console.error(err); }
    }
  }

  /** @param {Issue[]} errors @param {Issue[]} warnings */
  function showIssues(errors, warnings) {
    const form = /** @type {HTMLFormElement} */ (document.getElementById('dlg-form'));
    const general = [];
    for (const e of errors) {
      const name = String(e.field || '').split('.').pop();
      const slot = name ? form.querySelector(`[data-err="${name}"]`) : null;
      if (slot && !(/** @type {HTMLElement} */ (slot.closest('.field')) || {}).hidden) {
        slot.textContent = issueText(e);
        const ctl = form.querySelector(`[name="${name}"]`);
        if (ctl) ctl.setAttribute('aria-invalid', 'true');
      } else general.push(dialogs.notice('crit', esc(issueText(e))));
    }
    for (const w of warnings) general.push(dialogs.notice('warn', esc(issueText(w))));
    $('#dlg-general').innerHTML = general.join('');
  }

  async function submitDialog() {
    if (!dlgState) return;
    const { def, params } = dlgState;
    const form = /** @type {HTMLFormElement} */ (document.getElementById('dlg-form'));
    for (const s of form.querySelectorAll('[data-err]')) s.textContent = '';
    for (const c of form.querySelectorAll('[aria-invalid]')) c.removeAttribute('aria-invalid');
    $('#dlg-general').innerHTML = '';
    const button = /** @type {HTMLButtonElement} */ ($('#dlg-submit'));
    button.disabled = true;
    let r;
    try {
      r = await def.submit(dialogs.readForm(form), context(), params);
    } catch (err) {
      r = { ok: false, errors: [{ field: '', code: 'UNKNOWN', params: { code: String((err && /** @type {Error} */ (err).message) || err) } }], warnings: [] };
    }
    button.disabled = false;
    if (!r.ok) { showIssues(r.errors, r.warnings); return; }
    closeDialog();
    applyPrefs();
    toast(t(def.success || 'saved'), r.warnings);
    render();
  }

  // ── Exportes ─────────────────────────────────────────────────────────────────
  function stamp() {
    const p = HS.time.zonedParts(Date.now(), app.timeZone());
    const pad = (/** @type {number} */ n) => String(n).padStart(2, '0');
    return `${p.year}-${pad(p.month)}-${pad(p.day)}_${pad(p.hour)}${pad(p.minute)}`;
  }
  /** @param {string} filename @param {string | Uint8Array} data */
  async function deliver(filename, data) {
    const res = await platform.saveFile(filename, data);
    if (res.status === 'saved') toast(t('data.downloaded', { name: filename }));
    else if (res.status === 'declined') toast(t('data.declined'), [], 'warn');
    else toast(res.message || res.status, [], 'crit');
  }

  // ── Configuración ────────────────────────────────────────────────────────────
  /** @param {HTMLFormElement} form */
  async function saveSettings(form) {
    const v = dialogs.readForm(form);
    for (const s of form.querySelectorAll('[data-err]')) s.textContent = '';
    /** @type {Record<string, unknown>} */ const patch = { language: v.language, numberFormat: v.numberFormat, timeZone: String(v.timeZone || '').trim() };
    for (const k of ['alarmLowPct', 'alarmHighPct', 'semaphoreRedHours', 'semaphoreYellowHours', 'leadTimeDays', 'staleEstimateDays']) patch[k] = fmt.parseNumber(v[k]);
    const r = await app.updateSettings(patch);
    if (!r.ok) {
      for (const e of r.errors) {
        const slot = form.querySelector(`[data-err="${e.field}"]`);
        if (slot) slot.textContent = issueText(e); else toast(issueText(e), [], 'crit');
      }
      return;
    }
    platform.prefs.set('lang', String(v.language));
    applyPrefs();
    toast(t('set.saved'));
    render();
  }

  // ── Eventos ──────────────────────────────────────────────────────────────────
  /** @type {Record<string, (el: HTMLElement) => void | Promise<void>>} */
  const ACTIONS = {
    'op-dialog': (el) => openDialog(String(el.dataset.kind), { id: el.dataset.id, siloId: el.dataset.silo, lotId: el.dataset.lot }),
    'op-export': (el) => deliver(`hmiSilos_${el.dataset.table}_${stamp()}.csv`, app.exportOperationsCsv(String(el.dataset.table), { lang: i18n.getLang() })),
    'op-scrap-template': () => deliver('hmiSilos_plantilla_scrap.csv', '\uFEFFFecha;Período;Consecutivo;Material;Peso (Kg);Ubicación;Recipiente;Presentación (Dig);Estado;Línea\r\n2026-10-07;2026-10;EJEMPLO-001;Plano;100,00;Almacén;Estiba;Bobina;Pendiente;\r\n'),
    lang: (el) => { platform.prefs.set('lang', String(el.dataset.lang)); applyPrefs(); render(); },
    theme: () => { platform.prefs.set('theme', isDark() ? 'light' : 'dark'); applyTheme(); render(); },
    'dlg-close': () => closeDialog(),
    'dlg-reception': (el) => openDialog('reception', { siloId: el.dataset.silo }),
    'dlg-start': (el) => openDialog('start', { siloId: el.dataset.silo }),
    'dlg-change': (el) => openDialog('change', { siloId: el.dataset.silo }),
    'valve-stop': (el) => openDialog('stop', { siloId: el.dataset.silo }),
    'dlg-adjust': (el) => openDialog('adjust', { siloId: el.dataset.silo }),
    'dlg-totalizer': (el) => openDialog('totalizer', { siloId: el.dataset.silo }),
    'dlg-assign': (el) => openDialog('assign', { siloId: el.dataset.silo }),
    'dlg-period': (el) => openDialog('period', { siloId: el.dataset.silo }),
    'dlg-void': (el) => openDialog('void', { collection: el.dataset.collection, id: el.dataset.id }),
    'dlg-silo': (el) => openDialog('silo', { siloId: el.dataset.silo }),
    'dlg-new-silo': () => openDialog('silo', {}),
    'dlg-material': (el) => openDialog('material', { id: el.dataset.id }),
    'dlg-props': (el) => openDialog('props', { id: el.dataset.id }),
    'dlg-operator': () => openDialog('operator', {}),
    'dlg-reset': (el) => openDialog('reset', { kind: el.dataset.kind }),
    'dlg-restore': () => openDialog('restore', {}),
    regTab: (el) => { ui.regTab = String(el.dataset.tab); render(); },

    ack: async (el) => {
      const r = await app.acknowledgeAlert(String(el.dataset.id));
      if (r.ok) toast(t('saved')); else toast(issueText(r.errors[0]), [], 'crit');
      render();
    },
    'op-toggle': async (el) => {
      const op = app.dataset.operators.find((/** @type {OperatorRecord} */ o) => o.id === el.dataset.id);
      const r = await app.updateOperator(String(el.dataset.id), { active: !op.active });
      if (r.ok) toast(t('saved')); else toast(issueText(r.errors[0]), [], 'crit');
      render();
    },
    'export-xlsx': () => deliver(`hmiSilos_${stamp()}.xlsx`, app.exportWorkbook({ lang: i18n.getLang() })),
    'export-csv': (el) => {
      const table = el.dataset.table || /** @type {HTMLSelectElement} */ ($('#csv-table')).value;
      return deliver(`hmiSilos_${table}_${stamp()}.csv`, app.exportCsv(table, { lang: i18n.getLang() }));
    },
    'export-backup': () => deliver(`hmiSilos_respaldo_${stamp()}.json`, JSON.stringify(app.exportBackup())),
  };

  function bindEvents() {
    document.addEventListener('click', (e) => {
      const el = /** @type {HTMLElement | null} */ (/** @type {HTMLElement} */ (e.target).closest('[data-action]'));
      if (!el || !app) return;
      const handler = ACTIONS[String(el.dataset.action)];
      if (!handler) return;
      e.preventDefault();
      Promise.resolve(handler(el)).catch((err) => toast(String(err && err.message ? err.message : err), [], 'crit'));
    });
    document.addEventListener('change', (e) => {
      const el = /** @type {HTMLInputElement} */ (e.target);
      if (dlgState && el.closest('#dialog')) {
        if (el.name === 'siloId' && (dlgState.kind === 'reception' || dlgState.kind === 'assign')) {
          const state = app.stateAt(el.value, Date.now());
          const mat = /** @type {HTMLSelectElement | null} */ (document.querySelector('#dialog [name="materialId"]'));
          if (mat && state.materialId) mat.value = state.materialId;
        }
        if (el.name === 'type' && dlgState.kind === 'adjust') {
          const reason = /** @type {HTMLInputElement | null} */ (document.querySelector('#dialog [name="reason"]'));
          if (reason) reason.value = t(`adj.${el.value}`);
        }
        refreshDialog();
        return;
      }
      const target = /** @type {HTMLElement | null} */ (el.closest('[data-change]'));
      if (!target || !app) return;
      switch (target.dataset.change) {
        case 'operator': app.setOperator(el.value); platform.prefs.set('operator', el.value); break;
        case 'regSilo': ui.regSilo = el.value; render(); break;
        case 'histSilo': ui.histSilo = el.value; render(); break;
        case 'alertsActiveOnly': ui.alertsActiveOnly = el.checked; render(); break;
        default: break;
      }
    });
    let timer = 0;
    document.addEventListener('input', (e) => {
      if (!dlgState || !(/** @type {HTMLElement} */ (e.target)).closest('#dialog')) return;
      clearTimeout(timer);
      timer = /** @type {any} */ (setTimeout(refreshDialog, 120));
    });
    document.addEventListener('submit', (e) => {
      const form = /** @type {HTMLFormElement} */ (e.target);
      if (form.id === 'dlg-form') { e.preventDefault(); submitDialog(); }
      else if (form.dataset.submit === 'settings') { e.preventDefault(); saveSettings(form); }
    });
    $('#dialog').addEventListener('close', () => { dlgState = null; });
    root.addEventListener('hashchange', () => { parseHash(); render(); root.scrollTo(0, 0); });
    let resizeTimer = 0;
    root.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = /** @type {any} */ (setTimeout(charts.resizeAll, 200)); });
    if (root.matchMedia) root.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !dlgState) render(); });
  }

  function tick() {
    if (!app || dlgState || document.visibilityState === 'hidden') return;
    if (LIVE_ROUTES.includes(ui.route)) render();
    else $('#clock').textContent = `${fmt.shortDateTime(Date.now())} · ${app.timeZone()}`;
  }

  // ── Arranque ─────────────────────────────────────────────────────────────────
  async function boot() {
    applyTheme();
    /** @type {any} */ let repo = HS.localRepo.createLocalRepository();
    try {
      await repo.open();
      storage = 'local';
    } catch {
      repo = HS.memoryRepo.createMemoryRepository();
      storage = 'memory';
    }
    app = HS.app.createAppService({ repo });
    await app.init({ bootstrap: 'demo' });
    const op = platform.prefs.get('operator');
    if (op) app.setOperator(op);
    app.subscribe((/** @type {ServiceEvent} */ e) => { if (e.type === 'external' || e.type === 'reset') { applyPrefs(); if (!dlgState) render(); } });
    applyPrefs();
    parseHash();
    bindEvents();
    assistant = HS.assistantPanel.mount({ app, language: () => i18n.getLang(), storage: () => storage });
    render();
    platform.requestPersistence();
    setInterval(tick, 30_000);
  }

  /** Expuesto para pruebas de extremo a extremo. */
  /** @type {any} */ (root).hmiSilos = { get app() { return app; }, get ui() { return ui; }, render, openDialog };

  boot().catch((err) => {
    console.error(err);
    const main = document.getElementById('main');
    if (main) main.innerHTML = `<div class="notice crit">hmiSilos: ${esc(String(err && err.stack ? err.stack : err))}</div>`;
  });
})(globalThis);
